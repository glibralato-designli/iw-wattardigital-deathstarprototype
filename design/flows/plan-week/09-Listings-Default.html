/* Database › Cleaning (3.0 · 3.1): queues as a segmented control, one row per fix (current → proposed, reason, source and confidence),

button.ds-check:hover{border-color:var(--accent)}

.ds-box{width:1.125rem;height:1.125rem;flex:none;display:grid;place-items:center;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--bg);color:var(--accent-fg);padding:0}
.ds-box svg{width:.75rem;height:.75rem}
.ds-box[data-on]{background:var(--accent);border-color:var(--accent)}
.ds-empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-8) var(--space-4);text-align:center}
.ds-empty__icon{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:var(--radius-full);background:var(--bg-muted);color:var(--fg-muted)}
.ds-empty__icon[data-tone="danger"]{background:var(--danger-bg);color:var(--danger)}
.ds-empty__icon svg{width:1.125rem;height:1.125rem}
.ds-empty b{font-weight:var(--weight-medium)}
.ds-note{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2-5) var(--space-2);border-radius:var(--radius-md);background:var(--bg-subtle);color:var(--fg-muted)}
.ds-note svg{width:1rem;height:1rem;flex:none}
.ds-note--info{padding:var(--space-3) var(--space-3-5);border-radius:var(--radius-lg);background:var(--brand-primary-subtle);color:var(--brand-primary-text)}
.ds-dashed{padding:var(--space-6);text-align:center;border:var(--border-width) dashed var(--border-strong);border-radius:var(--radius-xl);color:var(--fg-muted)}

/* ───────── Badges: class and trust ───────── */
.ds-class{height:1.375rem;min-width:1.375rem;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0 var(--space-1);border:var(--border-width) solid transparent;border-radius:var(--radius-sm);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-semibold);white-space:nowrap}
.ds-class[data-label]{padding:0 var(--space-2);font-weight:var(--weight-medium)}
.ds-class[data-cls="A"]{background:var(--brand-primary);color:var(--brand-primary-on)}
.ds-class[data-cls="B"]{background:var(--brand-secondary);color:var(--brand-secondary-on)}
.ds-class[data-cls="C"]{background:var(--bg);border-color:var(--border-strong);color:var(--fg-secondary)}
.ds-class[data-cls="D"]{background:var(--bg-muted);color:var(--fg-subtle)}
.ds-trust[data-trust="stale"]{background:var(--bg-muted);border-color:var(--border);color:var(--fg-muted)}
.ds-chip{height:1.5rem;flex:none;display:inline-flex;align-items:center;gap:var(--space-1-5);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--bg-muted);color:var(--fg-muted);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-chip[data-tone="strong"]{color:var(--fg)}
.ds-chip[data-tone="outline"]{background:var(--bg);border:var(--border-width) solid var(--border);color:var(--fg-secondary)}
.ds-chip[data-tone="danger"]{background:var(--danger-bg);color:var(--danger)}
.ds-chip[data-tone="success"]{background:var(--success-bg);color:var(--success)}
.ds-chip[data-tone="info"]{background:var(--brand-primary-subtle);color:var(--brand-primary-text)}
.ds-chip svg{width:.875rem;height:.875rem}
button.ds-chip{border:var(--border-width) solid var(--border);background:var(--bg)}
button.ds-chip:hover{background:var(--bg-subtle)}
.ds-chip__bar{width:2.25rem;height:4px;border-radius:var(--radius-full);background:var(--border);overflow:hidden;display:flex}
.ds-chip__bar>span{height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-dot{width:6px;height:6px;flex:none;border-radius:var(--radius-full);background:var(--fg-disabled)}
.ds-dot[data-tone="active"]{background:var(--chart-primary)}.ds-dot[data-tone="good"]{background:var(--success)}.ds-dot[data-tone="bad"]{background:var(--danger)}
.ds-filter-chip{height:1.5rem;display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-full);background:var(--brand-primary-subtle);color:var(--brand-primary-text);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium)}
.ds-filter-chip svg{width:.75rem;height:.75rem}
.ds-pill-btn{height:1.75rem;display:inline-flex;align-items:center;padding:0 var(--space-2-5);border-radius:var(--radius-full);border:var(--border-width) solid var(--border);background:var(--bg);color:var(--fg-secondary);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-pill-btn:hover{background:var(--bg-subtle)}
.ds-pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* ───────── Progress and charts ───────── */
.ds-progress{width:7.5rem;height:6px;flex:none;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.ds-progress>span{display:block;height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-progress[data-tone="accent"]>span{background:var(--chart-primary)}
.ds-progress[data-size="thin"]{height:4px}
.ds-progress[data-fill]{width:auto}
.ds-bars{height:10.25rem;display:flex;align-items:flex-end;gap:var(--space-4);position:relative}
.ds-bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--space-1-5);min-width:0}
.ds-bar__v{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-bar__fill{width:100%;max-width:3rem;border-radius:var(--radius-xs);background:var(--chart-primary)}
.ds-bar__fill[data-today]{background:var(--chart-today)}
.ds-bar__fill[data-zero]{background:var(--chart-empty)}
.ds-bar__fill[data-muted]{background:var(--chart-muted)}
.ds-bar__d{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle);white-space:nowrap}
.ds-bar__v[data-zero]{color:var(--fg-disabled)}
.ds-goal{position:absolute;left:0;right:0;height:0;border-top:var(--border-width) dashed var(--chart-goal)}
.ds-goal>span{position:absolute;right:0;bottom:2px;padding-left:var(--space-1);background:var(--bg);font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-hbars{display:flex;flex-direction:column;gap:var(--space-2-5)}
.ds-hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.5rem;gap:var(--space-3);align-items:center}
.ds-hbar__track{height:8px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.ds-hbar__track>span{display:block;height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-hbar__track>span[data-tone="accent"]{background:var(--chart-primary)}.ds-hbar__track>span[data-tone="muted"]{background:var(--chart-muted)}
.ds-hbar__n{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-muted)}
.ds-linechart{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2) var(--space-2) 0}
.ds-linechart__plot{position:relative;height:10rem}
.ds-linechart__plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ds-line__grid{stroke:var(--border-subtle);stroke-width:1;vector-effect:non-scaling-stroke}
.ds-line__path{fill:none;stroke:var(--chart-primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ds-line__area{fill:var(--brand-primary-subtle);stroke:none}
.ds-linechart__dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:var(--radius-full);background:var(--bg);box-shadow:0 0 0 2px var(--chart-primary)}
.ds-linechart__dot[data-last]{width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px var(--chart-today)}
.ds-linechart__x{display:flex;justify-content:space-between;margin:0 calc(var(--space-4) * -1)}
.ds-linechart__x span{width:4rem;text-align:center;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}

/* ───────── Home ───────── */
.ds-plan__steps{display:flex;flex-direction:column;gap:var(--space-0-5)}
.ds-plan__actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-2-5) var(--space-2) var(--space-2);margin-top:var(--space-1-5)}
.ds-pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10rem,100%),1fr));gap:1px;border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--border)}
.ds-pulse__cell{display:flex;flex-direction:column;gap:var(--space-2-5);padding:var(--space-4);border:0;background:var(--bg);color:var(--fg);text-align:left;text-decoration:none;min-width:0;transition:background var(--motion-fast) var(--ease)}
.ds-pulse__cell:hover{background:var(--bg-subtle);color:var(--fg);text-decoration:none}
.ds-pulse__label{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);color:var(--fg-muted)}
.ds-pulse__value{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--space-0-5) var(--space-1-5)}
.ds-pulse__value b{font-size:var(--text-3xl);line-height:var(--line-height-2xl);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tighter);font-variant-numeric:tabular-nums}
/* The lead tile (Meetings this week) carries the one navy number in the pulse. */
.ds-pulse__cell[data-lead] .ds-pulse__value b,.ds-atile[data-lead] .ds-atile__value b{color:var(--brand-primary-text)}
.ds-delta{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);color:var(--fg-subtle)}
.ds-delta svg{width:.75rem;height:.75rem}
.ds-delta[data-tone="up"]{color:var(--success)}.ds-delta[data-tone="warn"]{color:var(--warning)}
.ds-metrics{border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);overflow:hidden;display:flex;flex-direction:column;flex:none}
.ds-metrics__strip{position:relative;background:var(--bg-subtle)}
.ds-metrics__tabs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.ds-metrics__strip[data-overflowing] .ds-metrics__tabs::after{content:'';min-width:3.5rem;flex:none}
.ds-mtab{flex:1 0 auto;min-width:8rem;display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-0-5);padding:var(--space-3-5) var(--space-4);border:0;box-shadow:inset -1px 0 0 var(--border-subtle);background:var(--bg-subtle);text-align:left;color:var(--fg-muted)}
.ds-mtab:last-child{box-shadow:none}
.ds-mtab .ds-meta{white-space:nowrap}
.ds-mtab:hover{background:var(--bg-muted)}
.ds-mtab[aria-selected="true"]{background:var(--bg);color:var(--fg)}
.ds-mtab__name{display:flex;align-items:center;gap:var(--space-1-5);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-mtab__name svg{width:.875rem;height:.875rem}
.ds-mtab__num{font-size:var(--text-lg);line-height:var(--line-height-lg);letter-spacing:var(--letter-spacing-tight);font-variant-numeric:tabular-nums;font-weight:var(--weight-medium);color:var(--fg-secondary)}
.ds-mtab[aria-selected="true"] .ds-mtab__num{font-weight:var(--weight-semibold);color:var(--brand-primary-text)}
.ds-metrics__fade{display:none;position:absolute;right:0;top:0;bottom:0;width:4.5rem;align-items:center;justify-content:flex-end;padding-right:var(--space-2-5);pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg-subtle) 70%)}
.ds-metrics__strip[data-overflowing] .ds-metrics__fade{display:flex}
.ds-metrics__fade button{pointer-events:auto;width:var(--control-sm);height:var(--control-sm);display:grid;place-items:center;padding:0;border:var(--border-width) solid var(--border);border-radius:var(--radius-full);background:var(--bg);color:var(--fg-secondary)}
.ds-metrics__fade button:hover{background:var(--bg-muted)}
.ds-metrics__fade svg{width:1rem;height:1rem}
.ds-metrics__panel{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.ds-metrics__head{display:flex;align-items:flex-end;gap:var(--space-4)}
.ds-headline{display:flex;align-items:baseline;gap:var(--space-1-5)}
.ds-headline b{font-size:var(--text-lg);line-height:var(--line-height-lg);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tight);font-variant-numeric:tabular-nums;color:var(--brand-primary-text)}
.ds-meetings .ds-row{align-items:flex-start;gap:var(--space-2-5)}
.ds-time{width:4.25rem;flex:none;white-space:nowrap;font-size:var(--text-xs);line-height:var(--line-height-sm);color:var(--fg-muted);font-variant-numeric:tabular-nums}
.ds-weekrow{display:flex;align-items:center;gap:var(--space-2-5);padding:var(--space-1) var(--space-2);border-radius:var(--radius-md)}
.ds-weekrow[data-today]{background:var(--bg-muted);font-weight:var(--weight-medium)}

/* ───────── Attack Plan ───────── */
.ds-callrow{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-4) var(--space-2);border-radius:var(--radius-md)}
.ds-callrow+.ds-callrow{border-top:var(--border-width) solid var(--border-subtle);border-radius:0}
.ds-callrow[data-done]{background:var(--bg-subtle)}
.ds-callrow__rank{align-self:start;display:flex;flex-direction:column;align-items:center;gap:var(--space-0-5);padding-top:2px}
.ds-callrow__rank>b{font-size:var(--text-lg);line-height:var(--line-height-lg);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;color:var(--fg-subtle)}
.ds-callrow__lift{display:inline-flex;align-items:center;gap:1px;font-size:var(--text-2xs);line-height:var(--line-height-2xs);font-weight:var(--weight-medium);color:var(--brand-secondary-text);white-space:nowrap;cursor:help}
.ds-callrow__lift svg{width:.625rem;height:.625rem}
.ds-callrow__body{display:flex;flex-direction:column;gap:var(--space-1-5);min-width:0}
.ds-callrow__top{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.ds-callrow__name{min-width:0;font-weight:var(--weight-semibold);color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-callrow__name:hover{color:var(--fg);text-decoration:underline}
.ds-callrow[data-done] .ds-callrow__name{color:var(--fg-subtle)}
.ds-callrow__why{display:flex;align-items:center;gap:var(--space-2);min-width:0;color:var(--fg-secondary)}
.ds-callrow__why>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-callrow__why .ds-trust{flex:none}
.ds-callrow__meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1) var(--space-3);min-width:0}
.ds-callrow__bld{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-called{width:var(--control-md);height:var(--control-md);display:grid;place-items:center;color:var(--success)}
.ds-called svg{width:1rem;height:1rem}
.ds-task{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-2);border-radius:var(--radius-md)}
.ds-task:hover{background:var(--bg-subtle)}
.ds-task .ds-icon-btn{opacity:1;color:var(--fg-disabled)}
.ds-task .ds-icon-btn:hover{color:var(--danger)}
.ds-task__meta{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-task__meta svg{width:.75rem;height:.75rem}
.ds-inline-add{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-2);margin-top:var(--space-1)}
.ds-inline-add>.ds-input-icon{flex:1 1 14rem;min-width:0}
.ds-inline-add>.select{flex:1 1 7rem}
.ds-input-icon{flex:1;height:var(--control-md);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2-5);border:var(--border-width) solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--fg-subtle)}
.ds-input-icon:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-halo)}
.ds-input-icon svg{width:1rem;height:1rem;flex:none}
.ds-input-icon input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);padding:0}
.ds-input-icon input::placeholder{color:var(--fg-placeholder)}
.ds-resolved{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-1-5) var(--space-2)}
.ds-resolved>span:nth-child(2){flex:1;color:var(--fg-subtle);text-decoration:line-through}
.ds-week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2)}
.ds-day{display:flex;flex-direction:column;gap:var(--space-0-5);padding:var(--space-2-5);border:var(--border-width) solid transparent;border-radius:var(--radius-md);background:var(--bg-subtle);text-align:left;color:var(--fg);min-width:0}
.ds-day:hover{border-color:var(--border-strong)}
.ds-day[data-today]{border-color:var(--border-strong)}
.ds-day[aria-pressed="true"]{background:var(--brand-primary-subtle);border-color:var(--brand-primary-300)}
.ds-day b{font-weight:var(--weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-goalrow{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2-5) 0}
.ds-goalrow>div:first-child{display:flex;align-items:center;gap:var(--space-2-5)}
.ds-goalrow .ds-progress{margin-left:1.75rem;width:auto}
.ds-datepick{position:relative}
.ds-datepick__btn{height:var(--control-md);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2-5);border:var(--border-width) solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--fg);white-space:nowrap}
.ds-datepick__btn:hover{background:var(--bg-subtle)}
.ds-datepick__btn svg{width:1rem;height:1rem;color:var(--fg-muted)}.ds-datepick__btn svg:last-child{width:.875rem;height:.875rem;color:var(--fg-disabled)}
.ds-datepick__pop{top:calc(100% + var(--space-2));left:0;width:18rem;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
.ds-minical{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:var(--space-0-5);text-align:center}
.ds-minical__dow{font-size:var(--text-2xs);line-height:var(--line-height-xs);color:var(--fg-subtle);font-weight:var(--weight-medium)}
.ds-minical__d{height:2.125rem;border:0;padding:0;border-radius:var(--radius-md);background:transparent;color:var(--fg);font-variant-numeric:tabular-nums}
.ds-minical__d:hover{background:var(--bg-muted)}
.ds-minical__d[data-out]{color:var(--fg-disabled)}
.ds-minical__d[data-today]{box-shadow:inset 0 0 0 1px var(--brand-primary-300)}
.ds-minical__d[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:var(--weight-semibold)}
.ds-minical__d[data-inweek]{background:var(--brand-primary-subtle);color:var(--brand-primary-text);border-radius:0}
.ds-minical__d[data-inweek][data-first]{border-radius:var(--radius-md) 0 0 var(--radius-md)}.ds-minical__d[data-inweek][data-last]{border-radius:0 var(--radius-md) var(--radius-md) 0}
.ds-minical[data-size="sm"] .ds-minical__d{width:1.625rem;height:1.625rem;justify-self:center;border-radius:var(--radius-full);font-size:var(--text-2xs);line-height:var(--line-height-2xs)}
.ds-minical[data-size="sm"] .ds-minical__d[data-today]{background:var(--accent);color:var(--accent-fg);box-shadow:none;font-weight:var(--weight-semibold)}
.ds-minical[data-size="sm"] .ds-minical__d[data-sel]{background:var(--brand-primary-subtle);color:var(--brand-primary-text);font-weight:var(--weight-semibold)}

/* ───────── Why now and evidence ───────── */
.ds-why{border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.ds-why__head{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.ds-why__head>svg{width:1rem;height:1rem;color:var(--brand-primary-text)}
.ds-why__head h2{font-size:var(--text-md);line-height:var(--line-height-sm)}
.ds-why__text{font-size:var(--text-body-lg);line-height:var(--line-height-body-lg);text-wrap:pretty;max-width:46rem}
/* System › Changes: one row per change, the date in a fixed column. */
.ds-chlist{display:flex;flex-direction:column}
.ds-chrow{display:grid;grid-template-columns:4rem minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);align-items:start;padding:var(--space-3) 0;border-top:var(--border-width) solid var(--border-subtle)}
.ds-chrow:first-child{border-top:0}
.ds-chrow__date{color:var(--fg-muted);font-weight:var(--weight-medium)}

/* ───────── Display tabs (Outreach performance, Reporting, Listings, Web analytics) ───────── */
.ds-statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10.5rem,100%),1fr));gap:1px;border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--border)}
.ds-stat{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3) var(--space-3-5);background:var(--bg);min-width:0}
.ds-stat b{font-size:var(--text-lg);line-height:var(--line-height-lg);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tight);font-variant-numeric:tabular-nums}
.ds-stat[data-zero] b{color:var(--fg-disabled)}
.ds-stat[data-emph]{background:var(--brand-primary-subtle)}
.ds-stat[data-emph] b{color:var(--brand-primary-text);font-size:var(--text-2xl);line-height:var(--line-height-2xl)}
.ds-statrow[data-compact]{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.ds-statrow[data-compact] .ds-stat{padding:var(--space-2-5) var(--space-3);gap:var(--space-0-5);justify-content:space-between}
.ds-statrow[data-compact] .ds-stat b{font-size:var(--text-md);line-height:var(--line-height-md)}
/* Property why now: the record's lines, then the five distress signals as present / not present. */
.ds-whylist{display:flex;flex-direction:column;gap:var(--space-1-5);margin:0;padding:0;list-style:none}
.ds-whylist li{display:flex;gap:var(--space-2);align-items:baseline;text-wrap:pretty}
.ds-whylist li::before{content:"";flex:none;width:.375rem;height:.375rem;border-radius:var(--radius-full);background:var(--brand-primary-text);transform:translateY(-.125rem)}
.ds-signals{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1-5)}
.ds-signals>.ds-meta{margin-right:var(--space-1)}
.ds-signal{height:1.5rem;display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:var(--border-width) dashed var(--border-strong);border-radius:var(--radius-full);color:var(--fg-subtle);font-size:var(--text-xs);line-height:var(--line-height-xs)}
.ds-signal[data-on]{border-style:solid;border-color:var(--brand-primary-border);background:var(--brand-primary-subtle);color:var(--brand-primary-text);font-weight:var(--weight-medium)}
.ds-signal svg{width:.75rem;height:.75rem}
.ds-storefront{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2-5) var(--space-3);border:var(--border-width) solid var(--border);border-radius:var(--radius-lg)}
.ds-storefront>svg{width:1rem;height:1rem;color:var(--fg-disabled);flex:none}
.ds-ownrow{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-3);border:var(--border-width) solid var(--border);border-radius:var(--radius-lg)}
.ds-ownrow__av{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:var(--radius-md);background:var(--brand-primary-subtle);color:var(--brand-primary-text);font-weight:var(--weight-semibold)}
.ds-section-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2)}
/* Display-tab sections: heading 16 above its content, content blocks a card gap apart. */
.ds-stack[data-section]{gap:var(--card-gap)}.ds-stack[data-section]>.ds-section-h{margin-bottom:calc(var(--space-4) - var(--card-gap))}
.ds-section-h h2{flex:1 0 auto}
/* Report blocks (Dashboard display tabs): labelled stat tiles with comparisons, deltas, coverage tiles, funnel, data tables, listing counts, inquiries. */
.ds-stat__label{display:flex;align-items:center;gap:var(--space-1-5);min-height:var(--control-sm);margin-block:calc(var(--space-1) * -1);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);color:var(--fg-muted)}
.ds-stat__label>svg{width:.875rem;height:.875rem;flex:none}
.ds-stat__label .ds-icon-btn{margin-right:calc(var(--space-1-5) * -1)}
.ds-stat__value{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.ds-stat[data-emph] .ds-stat__value b{font-size:var(--text-lg);line-height:var(--line-height-lg)}
.ds-stat .ds-progress{width:100%;margin-block:var(--space-1)}
.ds-stat__cmp{display:flex;gap:var(--space-5);padding-top:var(--space-2);margin-top:var(--space-1);border-top:var(--border-width) solid var(--border-subtle)}
.ds-stat__cmp>span{display:flex;flex-direction:column}
.ds-stat__cmpv{font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}
.ds-statrow[data-stack],.ds-statrow[data-stack]:not([data-compact]){grid-template-columns:minmax(0,1fr);grid-auto-rows:1fr}
.ds-delta[data-tone="flat"]{color:var(--fg-subtle)}
.ds-two[data-ratio="wide"]{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.ds-card__foot{padding-top:var(--space-3);border-top:var(--border-width) solid var(--border-subtle)}
.ds-effmetrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
.ds-effmetric{display:flex;flex-direction:column;gap:var(--space-1)}
.ds-effmetric .ds-progress{width:100%;margin-block:var(--space-1)}
.ds-effmetric__v{font-size:var(--text-2xl);line-height:var(--line-height-2xl);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tight);font-variant-numeric:tabular-nums}
.ds-effmetric__l{font-weight:var(--weight-medium)}
.ds-progress[data-tone="warn"]>span{background:var(--warning)}
.ds-card:has(>.ds-covgrid){container-type:inline-size}
.ds-covgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2-5)}
@container (min-width:56rem){.ds-covgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ds-cov{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:var(--border-width) solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle);color:var(--fg);text-align:left}
.ds-cov__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}
.ds-cov__top b{font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.ds-cov__p{font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;color:var(--brand-primary-text)}
.ds-cov[data-thin] .ds-cov__p{color:var(--warning)}
a.ds-cov{text-decoration:none;transition:border-color var(--motion-fast) var(--ease),background var(--motion-fast) var(--ease)}
a.ds-cov:hover{border-color:var(--border-strong);background:var(--bg)}
.ds-funnel{display:flex;flex-direction:column;gap:var(--space-3)}
.ds-funnel__row{display:grid;grid-template-columns:minmax(0,6rem) minmax(0,1fr) 4rem 3.5rem auto;gap:var(--space-3);align-items:center}
.ds-funnel__n{text-align:right;font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}
.ds-funnel__p{text-align:right;color:var(--fg-subtle);font-variant-numeric:tabular-nums}
.ds-hbars[data-wide] .ds-hbar{grid-template-columns:minmax(0,9rem) minmax(0,1fr) 5rem}
.ds-hbars[data-tail] .ds-hbar{grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.5rem auto}
.ds-dtable-wrap{overflow-x:auto;margin-inline:calc(var(--space-1) * -1)}
.ds-dtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ds-dtable th{padding:var(--space-2) var(--space-1);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);color:var(--fg-subtle);text-align:left;white-space:nowrap;border-bottom:var(--border-width) solid var(--border)}
.ds-dtable td{padding:var(--space-3) var(--space-1);border-bottom:var(--border-width) solid var(--border-subtle);vertical-align:top}
.ds-dtable tr:last-child td{border-bottom:0}
.ds-dtable [data-n]{text-align:right;white-space:nowrap}
.ds-dtable a{color:var(--fg);text-decoration:none}.ds-dtable a:hover{text-decoration:underline}
.ds-dtable__sub{display:block;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-dtable__bar{display:block;width:7.5rem;height:6px;margin-top:var(--space-2);border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.ds-dtable__bar>span{display:block;height:100%;border-radius:var(--radius-full);background:var(--chart-primary)}
.ds-live{display:inline;color:var(--success);font-weight:var(--weight-medium)}
.ds-live::before{content:"";display:inline-block;vertical-align:middle;margin:-2px var(--space-1-5) 0 0;width:6px;height:6px;border-radius:var(--radius-full);background:currentColor}
.ds-listing{display:flex;flex-direction:column;gap:var(--space-4);overflow:hidden}
/* Street view across the top of the card, edge to edge: a 12:5 strip on wide screens, 2:1 on phones and in the app. */
.ds-listing__photo{display:block;width:calc(100% + var(--space-5) * 2);max-width:none;height:auto;aspect-ratio:12 / 5;object-fit:cover;margin:calc(var(--space-5) * -1) calc(var(--space-5) * -1) 0;background:var(--bg-subtle);border-bottom:var(--border-width) solid var(--border)}
.ds-listing__counts{display:flex;flex-wrap:wrap;gap:var(--space-2-5)}
/* Listing activity: four compact cards (a 16:10 crop of the street view), the selected one outlined; its detail below. */
.ds-lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.ds-lcard{display:flex;flex-direction:column;min-width:0;padding:0;overflow:hidden;border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);background:var(--bg);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:border-color var(--motion-fast) var(--ease),box-shadow var(--motion-fast) var(--ease)}
.ds-lcard:hover{border-color:var(--border-strong)}
.ds-lcard[aria-pressed="true"]{border-color:var(--brand-primary-border);box-shadow:0 0 0 1px var(--brand-primary-border)}
.ds-lcard__img{display:block;width:100%;aspect-ratio:16 / 10;object-fit:cover;background:var(--bg-muted);overflow:hidden}
span.ds-lcard__img svg{display:block;width:100%;height:100%}
.ds-lcard__body{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3) var(--space-3-5) var(--space-3-5)}
.ds-lcard__top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-width:0}
.ds-lcard__stats{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin-top:var(--space-1-5);color:var(--fg-muted);font-size:var(--text-xs);line-height:var(--line-height-xs)}
.ds-lcard__stats b{color:var(--fg);font-weight:var(--weight-semibold)}
.ds-ldetail{display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-3)}
.ds-ldetail__head{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-3)}
.ds-ldetail__img{width:7.5rem;aspect-ratio:16 / 10;flex:none;border-radius:var(--radius-md);object-fit:cover;overflow:hidden;background:var(--bg-muted)}
span.ds-ldetail__img svg{display:block;width:100%;height:100%}
@media(max-width:1179px){.ds-lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.ds-lgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}.ds-lcard__body{padding:var(--space-2-5)}.ds-lcard__stats span:nth-child(2){display:none}.ds-lcard__top{flex-direction:column;align-items:flex-start;gap:var(--space-1)}.ds-lcard__top b{max-width:100%}.ds-ldetail__img{display:none}}
.ds-listing__count{flex:1 1 9rem;display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-1);padding:var(--space-3);border-radius:var(--radius-md);background:var(--bg-subtle)}
.ds-listing__count b{font-size:var(--text-md);line-height:var(--line-height-sm);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.ds-listing__count .button{margin-left:calc(var(--space-2) * -1)}
.ds-listing__auto{height:var(--control-xs);display:inline-flex;align-items:center;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-listing__viewers{display:flex;flex-direction:column;padding-top:var(--space-2);border-top:var(--border-width) solid var(--border-subtle)}
.ds-listing__viewers .ds-subhead{padding-inline:var(--space-2) 0}
.ds-listing__more{align-self:flex-start;margin:var(--space-2) var(--space-2) 0}
.ds-inq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-4) var(--space-5);border-top:var(--border-width) solid var(--border-subtle)}
.ds-inq:first-child{border-top:0}
.ds-inq[data-new]{box-shadow:inset 3px 0 0 var(--warning)}
.ds-inq__body{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.ds-inq__who{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.ds-inq__who b{font-weight:var(--weight-medium)}
.ds-inq__body p{color:var(--fg-secondary);text-wrap:pretty}
.ds-inq__acts{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end}
.ds-insight{display:flex;gap:var(--space-2-5);align-items:flex-start;padding:var(--space-2-5) var(--space-3);border-radius:var(--radius-lg);background:var(--brand-primary-subtle);color:var(--fg-secondary)}
.ds-insight+.ds-insight{margin-top:var(--space-2)}
.ds-insight svg{width:1rem;height:1rem;margin-top:2px;color:var(--brand-primary-text);flex:none}

/* ───────── Lists: the criteria builder (Database › Contacts), "Turn into a list", approvals ─────────
   A chip is a criterion and its values. Editable chips are outline buttons with a caret and a remove x; static chips
   (Brain answers, suggestions) are quiet tints; offered chips are dashed. AND across chips, OR inside one. */
.ds-pill-btn{gap:var(--space-1)}
.ds-pill-btn svg{width:.875rem;height:.875rem}
.ds-builder{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3);border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);background:var(--bg-subtle)}
.ds-builder__bar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
.ds-builder__foot{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2) var(--space-3)}
.ds-builder__count{font-size:var(--text-sm);line-height:var(--line-height-sm)}
.ds-builder__count b{font-size:var(--text-lg);line-height:var(--line-height-lg);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tight)}
.ds-crit{display:inline-flex;align-items:stretch;min-height:var(--control-md);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg);color:var(--fg);font-size:var(--text-xs);line-height:var(--line-height-xs);max-width:100%}
.ds-crit[data-editing]{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-halo)}
.ds-crit__main{display:inline-flex;align-items:center;gap:var(--space-1-5);min-width:0;padding:0 var(--space-2) 0 var(--space-2-5);border:0;border-radius:var(--radius-md) 0 0 var(--radius-md);background:none;color:inherit;font:inherit;cursor:pointer}
span.ds-crit__main{cursor:default}
.ds-crit__main:hover{background:var(--bg-subtle)}
.ds-crit svg{width:.875rem;height:.875rem;flex:none;color:var(--fg-muted)}
.ds-crit__k{color:var(--fg-muted);white-space:nowrap}
.ds-crit__v{font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ds-crit__x{width:var(--control-sm);display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:0 var(--radius-md) var(--radius-md) 0;background:none;color:var(--fg-muted);cursor:pointer}
.ds-crit__x:hover{background:var(--bg-muted);color:var(--fg)}
.ds-crit[data-static]{min-height:var(--control-sm);gap:var(--space-1-5);align-items:center;padding:0 var(--space-2-5);border-color:transparent;background:var(--brand-primary-subtle);color:var(--brand-primary-text)}
.ds-crit[data-static] svg,.ds-crit[data-static] .ds-crit__k{color:inherit}
button.ds-crit[data-suggest]{gap:var(--space-1-5);align-items:center;padding:0 var(--space-2-5);border-style:dashed;background:transparent;color:var(--fg-secondary);font:inherit;font-size:var(--text-xs);cursor:pointer}
button.ds-crit[data-suggest]:hover{background:var(--bg)}
.ds-crit-addbtn{min-height:var(--control-md);display:inline-flex;align-items:center;gap:var(--space-1-5);padding:0 var(--space-2-5);border:var(--border-width) dashed var(--border-strong);border-radius:var(--radius-md);background:transparent;color:var(--link);font:inherit;font-size:var(--text-xs);font-weight:var(--weight-medium);cursor:pointer}
.ds-crit-addbtn:hover,.ds-crit-addbtn[aria-expanded="true"]{background:var(--bg)}
.ds-crit-addbtn svg{width:.875rem;height:.875rem}
.ds-crit-from{display:inline-flex;align-items:center;gap:var(--space-1);margin-right:var(--space-1);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium)}
.ds-crit-from svg{width:.875rem;height:.875rem}
.ds-crit-edit{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-3-5);border:var(--border-width) solid var(--border);border-radius:var(--radius-lg);background:var(--bg)}
.ds-crit-edit__head{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
.ds-crit-edit__head svg{width:1rem;height:1rem;color:var(--fg-muted)}
.ds-crit-group{display:flex;flex-direction:column;gap:var(--space-1-5)}
.ds-crit-range{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--space-2)}
.ds-crit-range .field{width:9rem}
.ds-crit-range>.ds-meta{padding-bottom:var(--space-1-5)}
.ds-crit-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:var(--space-1-5)}
.ds-crit-type{height:var(--control-lg);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border:var(--border-width) solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--fg);font:inherit;font-size:var(--text-sm);font-weight:var(--weight-medium);text-align:left;cursor:pointer}
.ds-crit-type:hover{background:var(--bg-subtle);border-color:var(--border-strong)}
.ds-crit-type svg{width:1rem;height:1rem;color:var(--fg-muted)}
.ds-crit-confirm{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--space-2-5);padding:var(--space-3) var(--space-3-5);border:var(--border-width) solid var(--border);border-radius:var(--radius-lg);background:var(--bg)}
.ds-crit-done{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1-5) var(--space-3)}
.ds-tolist{flex:none}
.ds-tolist-row{display:flex;align-items:center;gap:var(--space-2)}
.ds-approve>svg{width:1rem;height:1rem;flex:none;color:var(--brand-primary-text)}
.ds-msg-bot button.ds-sugg{display:inline-flex;align-items:center;gap:var(--space-1-5);align-self:flex-start}
.ds-msg-bot button.ds-sugg svg{width:1rem;height:1rem;flex:none}

/* ───────── Team history and the relationship ─────────
   Team history is kept apart from the score: its chip is dashed with a people icon and never sits next to the score chip. */
.ds-teamchip{height:var(--control-xs);display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:var(--border-width) dashed var(--brand-secondary-border);border-radius:var(--radius-full);color:var(--brand-secondary-text);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap;background:transparent;text-decoration:none}
a.ds-teamchip:hover{background:var(--brand-secondary-subtle)}
.ds-teamchip svg{width:.875rem;height:.875rem}
/* The lift line: only when team history moved an owner's rank. Muted text, never a badge. */
.ds-lift{display:inline-flex;align-items:center;gap:var(--space-1);min-width:0;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-lift svg{width:.75rem;height:.75rem;flex:none;color:var(--brand-secondary-text)}
.ds-teamlist{display:flex;flex-direction:column}
.ds-teamrow{display:grid;grid-template-columns:3.5rem minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-3) 0;border-bottom:var(--border-width) solid var(--border-subtle)}
.ds-teamrow:last-child{border-bottom:0}
.ds-teamrow__year{font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.ds-teamrow__doc{display:inline-flex;align-items:center;gap:var(--space-1);color:var(--fg-muted);font-size:var(--text-xs);line-height:var(--line-height-xs)}
.ds-teamrow__doc svg{width:.875rem;height:.875rem;flex:none}
.ds-rel{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4) var(--space-5) var(--space-5);border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);background:var(--bg)}
.ds-rel__head{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
.ds-rel__head h2{font-size:var(--text-md);line-height:var(--line-height-sm)}
.ds-rel__head>svg{width:1rem;height:1rem;color:var(--fg-muted)}
.ds-rel__grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--space-5)}
.ds-rel__col{display:flex;flex-direction:column;gap:var(--space-2-5);min-width:0}

<script>/* Portal-safe navigation and screen-state presets. Product-safe: no review UI.
   Load it on every product page, after theme.js and before js/product.js (both deferred).
   Why: the Design Portal serves every screen state as its own renamed file. Screens survive
   that when (1) every move between screens is a real link in the markup, (2) a state can be
   switched on by a preset, and (3) timed moves only fire inside a real click-through.
   tools/export_portal.py relies on this contract. See DESIGN.md, "Portal export". */
(() => {
  const params = new URLSearchParams(location.search);
  // Exported portal files bake their state preset in; URL parameters still win.
  for (const [key, value] of Object.entries(window.PREVIEW_PARAMS || {})) if (!params.has(key)) params.set(key, value);
  const exported = window.PREVIEW_EXPORT === true;
  // ?preview=still (the canvas and exported snapshots): no timed moves, entrances settled.
  const still = params.get('preview') === 'still';
  const carried = ['theme'];

  const carry = href => {
    const url = new URL(href, location.href);
    if (url.origin === location.origin) for (const key of carried) if (params.get(key) && !url.searchParams.has(key)) url.searchParams.set(key, params.get(key));
    return url.href;
  };

  /* route('details') → the href of <a data-route="details"> (or a link to details.html) on this page.
     Script-driven moves must use it: hosts that rename screens rewrite those links, never script strings.
     For moves a script makes, add a hidden nav (hidden, data-routes, aria-hidden="true") holding one
     anchor per destination, with data-route set to the page name, an href to that page, and the trigger
     label as its text. See DESIGN.md, "Portal export", for the markup. */
  const route = (name, query = '') => {
    const link = document.querySelector(`a[data-route="${name}"]`) || document.querySelector(`a[href^="${name}.html"]`);
    const url = new URL(link ? link.getAttribute('href') : `${name}.html`, location.href);
    url.search = '';
    new URLSearchParams(query).forEach((value, key) => url.searchParams.set(key, value));
    return carry(url.href);
  };
  const go = (name, query) => location.assign(route(name, query));
  const replace = (name, query) => location.replace(route(name, query));

  // In an exported file, a timed move fires only when the visitor arrived from a sibling screen,
  // so a portal canvas frame of "Loading…" stays on its own state.
  const fromSibling = () => {
    try {
      const from = new URL(document.referrer);
      const folder = path => path.replace(/[^/]*$/, '');
      return from.origin === location.origin && folder(from.pathname) === folder(location.pathname);
    } catch (_) { return false; }
  };
  const advance = (fn, ms) => { if (!still && (!exported || fromSibling())) return setTimeout(fn, ms); };

  // Nav.asset('../assets/brand/logo.png') → the inlined copy in exported files, else the path itself.
  const asset = path => {
    const key = new URL(path, location.href).pathname.replace(/^.*?(?=assets\/)/, '');
    return (window.PREVIEW_ASSETS || {})[key] || path;
  };

  // Keep an explicit theme choice on in-product links.
  document.addEventListener('click', event => {
    const link = event.target.closest && event.target.closest('a[href]');
    if (link && link.origin === location.origin && carried.some(key => params.get(key))) link.href = carry(link.getAttribute('href'));
  });

  // Still previews render settled: finite entrances finish, ambient loops keep running.
  if (still) addEventListener('load', () => {
    for (const animation of document.getAnimations ? document.getAnimations() : []) {
      if (animation.effect && animation.effect.getTiming().iterations !== Infinity) animation.finish();
    }
  });

  window.Nav = { params, still, exported, route, go, replace, advance, asset };
})();
</script>

  /* ───────── Criteria: one object for the Database builder, Brain's lists and every "Turn into a list" ─────────

<script>/* Dashboard display tabs: Performance (outreach-performance), Who to call (reporting), Listings, Website (web-analytics).

  const range = (shown, note) => `<div class="ds-toolbar"><button type="button" class="ds-datepick__btn" aria-disabled="true" data-tip="${OFF}">${icon('calendar-blank')}<span>${esc(shown)}</span>${icon('caret-down')}</button>${note ? `<span class="ds-meta">${esc(note)}</span>` : ''}</div>`;

  // A stat tile: label row (icon, label, optional tool), value, then a meta line or comparison pairs.
  const stat = ({ l, ic, v, sub, tool = '', emph, cmp, extra = '', bar = '' }) => `<div class="ds-stat"${emph ? ' data-emph' : ''}${/^0(%|$)/.test(String(v)) ? ' data-zero' : ''}><span class="ds-stat__label">${ic ? icon(ic) : ''}<span class="ds-grow">${esc(l)}</span>${tool}</span><span class="ds-stat__value"><b>${esc(v)}</b>${extra}</span>${bar}${cmp ? `<span class="ds-stat__cmp">${cmp.map(([k, n]) => `<span><span class="ds-meta">${esc(k)}</span><span class="ds-stat__cmpv">${esc(n)}</span></span>`).join('')}</span>` : ''}${sub ? `<span class="ds-meta">${esc(sub)}</span>` : ''}</div>`;
  const table = (cols, rows, label) => `<div class="ds-dtable-wrap"><table class="ds-dtable" aria-label="${esc(label)}"><thead><tr>${cols.map(c => `<th scope="col"${c.n ? ' data-n' : ''}>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((v, i) => `<td${cols[i].n ? ' data-n' : ''}>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const inlineBar = (v, max) => `<span class="ds-dtable__bar" aria-hidden="true"><span style="width:${Math.max(3, Math.round(v / max * 100))}%"></span></span>`;

  const outreach = () => {

      section('Outreach', 'Counted automatically', activity + `<div class="ds-two" data-ratio="wide">${eff}${reach}</div>`) +

    const hit = zips.reduce((a, z) => a + z.hit, 0), reach = zips.reduce((a, z) => a + z.reach, 0), warm = zips.reduce((a, z) => a + z.warm, 0);
    const cov = `<div class="ds-card" data-pad="lg"><div class="ds-card__head"><div class="ds-card__title"><span class="ds-headline"><b>${Math.round(hit / reach * 100)}%</b><span class="ds-meta">coverage</span></span><span class="ds-meta">${loc(hit)} of ${loc(reach)} reachable owners touched · ${loc(warm)} warm · ${loc(R.engaged)} engaged</span><span class="ds-meta">Class A: 64% called, +4 pts this week</span></div>${offSeg(R.channels, 0, 'Coverage channel')}</div>
      <div class="ds-covgrid">${zips.map(z => `<a class="ds-cov" href="${DS.crit.href('hood:' + z.z, 'from=reporting')}" aria-label="${esc(z.z + ', ' + Math.round(z.p) + '% coverage. Turn into a list')}" data-tip="Turn ${esc(z.z)} into a list"${z.p < 5 ? ' data-thin' : ''}><span class="ds-cov__top"><b>${z.z}</b><span class="ds-cov__p">${Math.round(z.p)}%</span></span>${ui.progress(z.p / 15, z.z + ' coverage', { tone: z.p < 5 ? 'warn' : 'accent', fill: true })}<span class="ds-meta">${loc(z.hit)} of ${loc(z.reach)} touched${z.warm ? ` · ${loc(z.warm)} warm` : ''}</span></a>`).join('')}</div></div>`;
    const steps = [['Sent', F.sent, 'Received'], ['Delivered', F.delivered, 'Delivered'], ['Opened', F.opened, 'Opened'], ['Clicked', F.clicked, 'Clicked']];
    const stepCrit = v => 'eng:' + (v === 'Clicked' ? 'Clicked Q3 market report email' : v + ' Q3 market report');
    const funnel = `<div class="ds-card" data-pad="lg">${cardHead('Marketing funnel', 'Percentages are of sent')}<div class="ds-funnel">${steps.map(([l, v, e]) => `<div class="ds-funnel__row"><span>${l}</span><span class="ds-hbar__track"><span data-tone="accent" style="width:${Math.max(2, Math.round(v / F.sent * 100))}%"></span></span><span class="ds-funnel__n">${loc(v)}</span><span class="ds-funnel__p">${share(v, F.sent)}</span>${ui.toList(stepCrit(e), { icon: true, q: 'from=reporting', aria: 'Turn ' + l.toLowerCase() + ' into a list' })}</div>`).join('')}</div>
      <div class="ds-statrow" data-compact>${[['Open rate', share(F.opened, F.sent)], ['Click rate', share(F.clicked, F.sent)], ['Click-to-open', share(F.clicked, F.opened)], ['Bounced', loc(F.bounced)], ['Unsubscribed', loc(F.unsub)]].map(([l, v]) => stat({ l, v })).join('')}</div></div>`;
    const clicked = `<div class="ds-card" data-pad="lg">${cardHead('Clicked what', 'Unique people per link', ui.toList('eng:Clicked Q3 market report email', { label: 'See who', q: 'from=reporting' }))}${ui.hbars(R.clicked, { tone: 'accent', tail: l => ui.toList('eng:Clicked ' + l, { icon: true, q: 'from=reporting', aria: 'Turn “' + l + '” into a list' }) })}</div>`;
    const channel = e => `<div class="ds-card" data-pad="lg">${cardHead(e.t, e.v)}<span class="ds-headline"><b>${esc(e.head)}</b></span>${ui.kv(e.rows, { compact: true })}<span class="ds-meta">${esc(e.foot)}</span></div>`;
    return range('Last 30 days', 'Sep 1 – Sep 30') +
      section('Who we haven’t reached', 'Coverage by ZIP, weakest first. Each ZIP turns into a call list.', cov) +
      section('Who engaged', 'The last campaign and what people clicked. Each stage and link turns into a call list.', `<div class="ds-two" data-ratio="wide">${funnel}${clicked}</div>`, offSeg(R.emailChannels, 0, 'Outreach channel')) +
      section('Engagement by channel', '', `<div class="ds-three">${R.engagement.map(channel).join('')}</div>`);
  };

  /* ── Listings: each listing with its counts and viewers, then what came in through the website ── */
  const listings = () => {
    /* Four compact listing cards in a row; the selected one opens its viewers, offers and counts in one panel below. */
    const slug = l => l.addr.toLowerCase().replace(/\W+/g, '-'), sel = Math.max(0, D.listings.findIndex(l => slug(l) === lst.sel)), cur = D.listings[sel];
    const art = (l, cls) => l.photo ? `<img class="${cls}" src="${Nav.asset((DS.app ? '../../' : '../') + l.photo)}" alt="" width="800" height="336" decoding="async">` : `<span class="${cls}" aria-hidden="true">${DS.streetArt({ id: slug(l), label: l.addr, ...l.art })}</span>`;
    const tone = st => st === 'Active' ? 'success' : st === 'In contract' ? 'info' : 'warning';
    const count = (l, k) => (l.counts.find(c => c[0] === k) || [])[1] || 0;
    const card = (l, i) => `<button type="button" class="ds-lcard" aria-pressed="${i === sel}" data-act="pick-listing" data-arg="${slug(l)}" aria-label="${esc(l.addr + ', ' + l.status)}">${art(l, 'ds-lcard__img')}
      <span class="ds-lcard__body"><span class="ds-lcard__top"><b class="ds-ellipsis">${esc(l.addr)}</b><span class="badge" data-status="${tone(l.status)}">${esc(l.status)}</span></span><span class="ds-meta ds-ellipsis">${esc(l.sub.split(' · ').filter((x, j) => j !== 2).join(' · '))}</span>
        <span class="ds-lcard__stats"><span><b class="num">${loc(count(l, 'Website views'))}</b> views</span><span><b class="num">${l.viewers.length}</b> known</span><span><b class="num">${l.offers ? l.offers.length : 0}</b> ${l.offers && l.offers.length === 1 ? 'offer' : 'offers'}</span></span></span></button>`;
    const detail = l => { const hood = l.sub.split(' · ')[0], q = 'from=listings&sugg=' + encodeURIComponent('hood:' + hood), vs = l.viewers, shown = vs.slice(0, 6);
      return `<section class="ds-card ds-ldetail" data-pad="lg" aria-label="${esc(l.addr)}" data-anim="fade" data-key="ldetail-${slug(l)}">
        <div class="ds-ldetail__head">${art(l, 'ds-ldetail__img')}<div class="ds-row__body ds-grow"><span style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap"><h3 class="ds-title-xl">${esc(l.addr)}</h3><span class="badge" data-status="${tone(l.status)}">${esc(l.status)}</span></span><span class="ds-meta">${esc(l.sub)}</span></div>${ui.btn({ label: 'Open OM', ic: 'file-text', variant: 'outline', size: 'sm', disabled: true })}${ui.toList('eng:Viewed ' + l.addr, { q })}</div>
        <div class="ds-listing__counts">${l.counts.map(([k, v, auto]) => `<div class="ds-listing__count"><span class="ds-meta">${esc(k)}</span><b>${loc(v)}</b>${auto ? '<span class="ds-listing__auto">Auto</span>' : ui.btn({ label: 'Log', ic: 'plus', variant: 'ghost', size: 'xs', disabled: true })}</div>`).join('')}</div>
        <div class="ds-two" data-ratio="even"><div class="ds-listing__viewers"><div class="ds-subhead"><h3>Viewed by · 30 days</h3><span class="ds-meta">${vs.length} ${vs.length === 1 ? 'person' : 'people'} in your database</span></div>${shown.map(([id, n, last]) => { const c = D.cById[id]; return `<a class="ds-row" data-dense href="${href('contact', 'id=' + id)}">${ui.cls(c.cls)}<span class="ds-row__body"><span class="ds-row__title">${esc(c.name)}</span><span class="ds-row__sub">${n} ${n === 1 ? 'view' : 'views'} · last ${esc(last)} · owns in ${esc(D.pById[c.pid].hood)}</span></span><span class="ds-row__end">${icon('caret-right')}</span></a>`; }).join('')}${vs.length > shown.length ? `<a class="ds-link-btn ds-listing__more" href="${DS.crit.href('eng:Viewed ' + l.addr, q)}">View all ${vs.length}${icon('caret-right')}</a>` : ''}</div>
          <div class="ds-listing__viewers"><div class="ds-subhead"><h3>Written offers</h3><span class="ds-meta">ask ${esc(l.sub.split(' · ').pop())}</span></div>${l.offers && l.offers.length ? table([{ l: 'From' }, { l: 'Amount', n: 1 }, { l: 'Received', n: 1 }, { l: 'Status' }], l.offers.map(([who, amt, d, s2]) => [esc(who), `<b>${esc(amt)}</b>`, esc(d), `<span class="ds-meta">${esc(s2)}</span>`]), 'Written offers on ' + l.addr) : '<div class="ds-dashed">No written offers yet.</div>'}</div></div></section>`; };
    const waiting = D.inquiries.filter(q => q[7]).length;
    const inq = `<div class="ds-card" data-pad="none">${D.inquiries.map(([n, form, reach, about, msg, when, inDb, isNew]) => `<div class="ds-inq"${isNew ? ' data-new' : ''}><span class="ds-tile-icon">${icon('envelope-simple')}</span><div class="ds-inq__body"><span class="ds-inq__who"><b>${esc(n)}</b><span class="ds-meta">${esc(form)}</span>${inDb ? '<span class="badge" data-status="info">In database</span>' : ''}${isNew ? '<span class="badge" data-status="warning">Awaiting follow-up</span>' : ''}</span><p>${esc(msg)}</p><span class="ds-meta">${esc(reach)} · ${esc(about)} · ${esc(when)}</span></div><div class="ds-inq__acts">${ui.btn({ label: 'Reply', variant: 'outline', size: 'sm', disabled: true })}${ui.btn({ label: isNew ? 'Mark handled' : 'Reopen', variant: 'ghost', size: 'sm', disabled: true })}</div></div>`).join('')}</div>`;
    const small = (t, rows, act, link) => `<section class="ds-card" aria-label="${esc(t)}"><div class="ds-card__head"><div class="ds-card__title"><h3>${esc(t)}</h3></div><span class="ds-meta">${rows.length}</span></div>${rows.map(([a, b, d]) => `<div class="ds-row" data-dense><span class="ds-row__body"><span class="ds-row__title">${esc(a)}</span><span class="ds-row__sub">${esc(b)}</span></span><span class="ds-meta">${esc(d)}</span></div>`).join('')}${act ? link ? `<a class="ds-link-btn ds-listing__more" href="${link}">${esc(act)}${icon('caret-right')}</a>` : `<button type="button" class="ds-link-btn ds-listing__more" aria-disabled="true" data-tip="${OFF}">${esc(act)}${icon('caret-right')}</button>` : ''}</section>`;
    const I = D.inbound, Ev = I.events;
    const events = `<div class="ds-card" data-pad="lg">${cardHead('Events page', Ev.name)}<div class="ds-two" data-ratio="even"><div class="ds-statrow" data-compact>${stat({ l: 'Views · 7 days', v: Ev.v7 })}${stat({ l: 'Views · 30 days', v: Ev.v30 })}${stat({ l: 'RSVPs', v: Ev.rsvps, sub: Ev.rsvps7 + ' this week' })}</div><div class="ds-stack" data-gap="2"><span class="ds-meta">Traffic sources · 30 days</span>${ui.hbars(Ev.refs)}</div></div></div>`;
    return range('All time', 'Auto counts tracked engagement. Tours and offers are logged with a record.') +
      section('Listings', `${D.listings.length} listings on the website · pick one for its viewers and offers`, `<div class="ds-lgrid" role="group" aria-label="Listings">${D.listings.map(card).join('')}</div>${detail(cur)}`) +
      section('Website inquiries', `${waiting} awaiting follow-up · every form on stewartgroup.example`, inq, offIcon('arrow-clockwise', 'Refresh')) +
      section('Other website requests', '', `<div class="ds-three">${small('Buyer registrations', I.buyers)}${small('BOV requests', I.bov, 'Open auto-BOV', href('bov', 'id=p90c'))}${small('Bookings', I.bookings)}</div>${events}`);
  };

  /* ── Web analytics: audience and outcomes, the trend and its summary, then sources, people, content, speed ── */
  const web = () => {
    const W = D.web, maxCh = Math.max(...W.channels.map(c => c[1]));
    const rate = r => `<span class="badge" data-status="${r === 'good' ? 'success' : r === 'needs' ? 'warning' : 'danger'}">${r === 'good' ? 'Good' : r === 'needs' ? 'Needs work' : 'Poor'}</span>`;
    const lcp = v => parseFloat(v) <= 2.5 ? 'good' : parseFloat(v) <= 4 ? 'needs' : 'poor';
    const head = `<div class="ds-toolbar"><span class="ds-grow ds-meta">${esc(W.site)} · first-party, no cookies · <span class="ds-live">${W.now} on the site now</span> · ${W.realtime.map(([p, n]) => `${esc(p)} ${n}`).join(' · ')}</span>${ui.btn({ label: 'Open the editor', ic: 'arrow-square-out', variant: 'outline', size: 'sm', disabled: true })}${offSeg(['7 days', '30 days', '90 days'], 1, 'Date range')}</div>`;
    const audience = `<div class="ds-statrow">${W.audience.map(([l, v, s], i) => stat({ l, v, sub: s, emph: i === 0 })).join('')}</div>`;
    const outcomes = `<div class="ds-statrow">${W.outcomes.map(([l, v, s]) => stat({ l, v, sub: s })).join('')}</div>`;
    const trend = `<div class="ds-two" data-ratio="wide"><div class="ds-card" data-pad="lg">${cardHead('Visitors per week', 'Last 7 weeks', '<span class="ds-headline"><b>1,284</b><span class="ds-meta">this week</span></span>')}${ui.line(W.weeks, { aria: 'Visitors per week, rising from 880 to 1,284' })}</div>
      <section class="ds-card" data-pad="lg" aria-label="What the numbers say">${cardHead('What the numbers say', 'Plain summary, refreshed daily')}<div>${W.insights.map(t => `<div class="ds-insight">${icon('sparkle')}<span>${esc(t)}</span></div>`).join('')}</div></section></div>`;
    const sources = `<div class="ds-two" data-ratio="wide"><div class="ds-card" data-pad="lg">${cardHead('Channels', 'Sessions by channel. Conversions are form submissions.')}${table([{ l: 'Channel' }, { l: 'Sessions', n: 1 }, { l: '' }, { l: 'Engaged', n: 1 }, { l: 'Conv.', n: 1 }], W.channels.map(([c, s, e, cv]) => [esc(c), loc(s), inlineBar(s, maxCh), e, cv ? `<b>${cv}</b>` : '<span class="muted">0</span>']), 'Sessions by channel')}</div>
      <div class="ds-card" data-pad="lg">${cardHead('Campaigns', 'Sessions by tagged campaign')}${table([{ l: 'Campaign' }, { l: 'Sessions', n: 1 }, { l: 'Conv.', n: 1 }], W.campaigns.map(([c, ch, s, cv]) => [`${esc(c)}<span class="ds-dtable__sub">${esc(ch)}</span>`, loc(s), cv ? `<b>${cv}</b>` : '<span class="muted">0</span>']), 'Sessions by campaign')}</div></div>`;
    const people = `<div class="ds-card" data-pad="lg">${cardHead('Known contacts on the site', 'Arrived through a tracked email link. Names open the contact.', ui.toList('eng:Visited the website', { q: 'from=web-analytics' }))}${table([{ l: 'Contact' }, { l: 'Views', n: 1 }, { l: 'Pages' }, { l: 'Last visit', n: 1 }], W.contacts.map(([id, v, pg, last, ch]) => { const c = D.cById[id]; return [`<a href="${href('contact', 'id=' + id)}"><b>${esc(c.name)}</b></a><span class="ds-dtable__sub">${esc(ch)}</span>`, v, esc(pg), esc(last)]; }), 'Known contacts on the site')}</div>`;
    const content = `<div class="ds-two" data-ratio="wide"><div class="ds-card" data-pad="lg">${cardHead('Pages', 'Views, people, engaged time and how far they scrolled')}${table([{ l: 'Page' }, { l: 'Views', n: 1 }, { l: 'People', n: 1 }, { l: 'Engaged', n: 1 }, { l: 'Scroll', n: 1 }], W.pages.map(([p, v, pp, e, s]) => [esc(p), loc(v), loc(pp), e, s]), 'Pages')}</div>
      <div class="ds-card" data-pad="lg">${cardHead('Documents and OMs', 'Every download, by file')}${table([{ l: 'File' }, { l: 'Downloads', n: 1 }, { l: 'People', n: 1 }, { l: '' }], W.documents.map(([t, f, d, p]) => [`${esc(t)}<span class="ds-dtable__sub">${esc(f)}</span>`, d, p, ui.toList('eng:Downloaded ' + t, { icon: true, q: 'from=web-analytics', aria: 'Turn “' + t + '” downloads into a list' })]), 'Documents and OMs')}</div></div>
      <div class="ds-two" data-ratio="even"><div class="ds-card" data-pad="lg">${cardHead('Forms', 'Started, submitted, and inquiries received')}${table([{ l: 'Form' }, { l: 'Started', n: 1 }, { l: 'Sent', n: 1 }, { l: 'Inquiries', n: 1 }], W.forms.map(([f, st, sb, iq]) => [esc(f), st, sb, iq ? `<b>${iq}</b>` : '<span class="muted">0</span>']), 'Forms')}</div>
      <div class="ds-card" data-pad="lg">${cardHead('Calls, emails and links clicked', 'Phone and email links, buttons and outbound links')}${table([{ l: 'Kind' }, { l: 'Target' }, { l: 'Clicks', n: 1 }], W.clicks.map(([k, t, n]) => [esc(k), esc(t), n]), 'Clicks')}</div></div>`;
    const poor = W.vitalPages.filter(v => lcp(v[1]) === 'poor').length;
    const speed = `<div class="ds-statrow" data-compact>${W.vitals.map(([l, v, code, r]) => stat({ l, v, sub: code, extra: rate(r) })).join('')}</div>${table([{ l: 'Page' }, { l: 'Largest paint', n: 1 }, { l: 'Taps', n: 1 }, { l: 'Layout shift', n: 1 }, { l: 'Rating' }], W.vitalPages.map(([p, a, b, c]) => [esc(p), a, b, c, rate(lcp(a))]), 'Speed by page')}<span class="ds-meta">75th percentile of real visits, rated on Google’s thresholds.</span>`;
    const tracking = `<p>One first-party script on every page records page views, engaged time, scroll depth, downloads, phone, email and outbound clicks, form starts and submissions, and speed. No cookies and no third-party trackers; visitors are counted with a hash that rotates daily. Portal previews are never counted.</p><p>To tie a visit to the owner who clicked, tracked email links carry the campaign and the contact. The visit then appears above and on that contact’s timeline.</p>`;
    const acc = (k, def) => { const a = DS.V.acc || {}; return k in a ? a[k] : def; };
    return head +
      section('Audience', 'Last 30 days', audience) +
      section('Outcomes', 'What the visits produced', outcomes) +
      section('Traffic', '', trend) +
      section('Where visitors come from', '', sources) +
      section('Who is on the site', '', people) +
      section('Content', '', content) +
      `<div class="ds-acc">${ui.acc('wa-speed', 'Site speed', `All four vitals are good · ${poor} page is slow on phones`, speed, acc('wa-speed', false))}${ui.acc('wa-track', 'How tracking works', 'First-party, no cookies', tracking, acc('wa-track', false))}</div>`;
  };
  const BODY = { 'outreach-performance': outreach, reporting, listings, 'web-analytics': web };

  DS.define({
    id: page, nav: 'dashboard', brain: 'min',
    crumbs: () => [{ l: 'Dashboard', page: 'home' }, { l: LABEL[page] }],
    scope: () => LABEL[page],
    render: () => `<div class="ds-page">${ui.pageHead('Dashboard', ui.tabs(D.dashboardTabs, page, 'Dashboard'))}${ui.nudge(D.nudges[page])}${BODY[page]()}</div>`,
    acts: { 'pick-listing': (el, k) => { lst.sel = k; DS.render(); } },
  });
})();
</script>
</body>
</html>
