.ds-topbar{height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-2) 0 var(--space-4);color:var(--shell-fg);position:relative;z-index:var(--layer-shell)}
.ds-crumbs{display:flex;align-items:center;gap:var(--space-1-5);flex:1;min-width:0}
.ds-crumbs a{color:var(--shell-fg-icon);white-space:nowrap}.ds-crumbs a:hover{color:var(--shell-fg-strong)}
.ds-crumbs svg{width:.875rem;height:.875rem;color:var(--shell-disabled);flex:none}

.ds-topbar__tools{display:flex;align-items:center;gap:var(--space-3);flex:none;padding-right:var(--space-1)}
.ds-search-trigger{width:20rem;height:var(--control-lg);flex:none;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2-5);border:var(--border-width) solid var(--shell-active-border);border-radius:var(--radius-md);background:var(--shell-hover);color:var(--shell-fg-icon);text-align:left}
.ds-search-trigger:hover{background:var(--shell-chip)}
.ds-search-trigger svg{width:1rem;height:1rem}.ds-search-trigger>span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-search-trigger kbd{background:var(--shell-chip);color:var(--shell-fg)}
.ds-shell-btn{height:var(--control-lg);display:flex;align-items:center;gap:var(--space-1-5);padding:0 var(--space-3);border:0;border-radius:var(--radius-md);background:transparent;color:var(--shell-fg);white-space:nowrap}
.ds-shell-btn:hover{background:var(--shell-hover);color:var(--shell-fg-strong)}
.ds-shell-btn svg{width:1.125rem;height:1.125rem}.ds-shell-btn svg+svg{width:.875rem;height:.875rem}
.ds-bell{width:var(--control-lg);height:var(--control-lg);display:grid;place-items:center;position:relative;color:var(--shell-fg);cursor:not-allowed;border-radius:var(--radius-md)}

/* Ask Brain: the only gradient in the shell, a border on a pill. Solid white when the panel is open. */
.ds-ask{height:var(--control-lg);display:flex;align-items:center;gap:var(--space-1-5);padding:0 var(--space-4) 0 var(--space-3);border:var(--border-width) solid transparent;border-radius:var(--radius-full);background:linear-gradient(var(--shell-raised),var(--shell-raised)) padding-box,var(--shell-gradient) border-box;color:var(--shell-fg-strong);font-weight:var(--weight-medium);white-space:nowrap;transition:background var(--motion-fast) var(--ease)}

.ds-ask[aria-pressed="true"]{background:linear-gradient(var(--white),var(--white)) padding-box,var(--shell-gradient) border-box;color:var(--brand-primary-950)}
.ds-ask[aria-pressed="true"] svg{color:var(--brand-primary-950)}
.ds-ask__dot{width:7px;height:7px;border-radius:var(--radius-full);background:var(--brand-primary-300);margin-left:var(--space-0-5)}

/* ───────── Popovers on the shell (menus, guide) ───────── */
.ds-pop{position:absolute;z-index:var(--layer-popover);background:var(--bg);color:var(--fg);border:var(--border-width) solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:var(--space-1-5)}

.ds-menu{display:flex;flex-direction:column;gap:var(--space-0-5)}
.ds-theme-switch{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-2) var(--space-1-5)}
.ds-theme-switch>span{flex:1;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle);font-weight:var(--weight-medium)}
.ds-theme-switch .segmented__item{display:inline-flex;align-items:center;gap:var(--space-1);min-height:1.5rem;font-size:var(--text-xs);line-height:var(--line-height-xs);padding:0 var(--space-2)}

.ds-guide{left:calc(100% + var(--space-3));bottom:0;width:25rem;max-height:calc(100vh - 8.75rem);display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.ds-guide__flows,.ds-guide__struct{flex:1;min-height:0;overflow-y:auto;margin:0 calc(var(--space-2) * -1);padding:0 var(--space-2);display:flex;flex-direction:column;gap:var(--space-0-5)}
.ds-guide__struct{gap:var(--space-3)}
.ds-guide__flow{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2);border-radius:var(--radius-md)}
.ds-step-num{width:1.375rem;height:1.375rem;flex:none;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--bg-muted);color:var(--fg-secondary);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium)}
.ds-struct-row{display:grid;grid-template-columns:1.125rem minmax(0,1fr) auto;gap:var(--space-2-5);align-items:start;padding:var(--space-1-5) var(--space-2);border-radius:var(--radius-md);color:var(--fg);text-decoration:none}
a.ds-struct-row:hover{background:var(--bg-subtle);text-decoration:none;color:var(--fg)}
.ds-struct-row svg{width:1rem;height:1rem;margin-top:2px;color:var(--fg-disabled)}
.ds-struct-head{display:flex;align-items:baseline;gap:var(--space-2);padding:0 var(--space-2) var(--space-0-5);font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-struct-head b{flex:1}

/* ───────── Page scaffolding inside the main panel ───────── */
.ds-page{padding:var(--page-pad-top) var(--page-pad-x) var(--space-8);display:flex;flex-direction:column;gap:var(--section-gap);min-height:100%}
.ds-page-head{display:flex;flex-direction:column;gap:var(--space-4)}
.ds-page-title{display:flex;flex-direction:column;gap:var(--space-0-5)}
.ds-org{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-greeting{display:flex;flex-direction:column;gap:var(--space-1)}
.ds-lede{color:var(--fg-muted)}
.ds-nudge{display:flex;align-items:center;gap:var(--space-2);margin-top:calc(var(--space-2) * -1);color:var(--fg-muted)}
.ds-nudge svg{width:1rem;height:1rem;color:var(--brand-primary-text)}

.ds-split{display:grid;grid-template-columns:minmax(0,1fr) 18.75rem;gap:var(--space-6);align-items:start}
.ds-stack{display:flex;flex-direction:column;gap:var(--space-6);min-width:0}
.ds-stack[data-gap="4"]{gap:var(--space-4)}.ds-stack[data-gap="3"]{gap:var(--space-3)}.ds-stack[data-gap="2"]{gap:var(--space-2)}
.ds-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--card-gap)}
.ds-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--card-gap)}
.ds-toolbar{display:flex;align-items:center;gap:var(--space-3) var(--space-2);flex-wrap:wrap}
.ds-toolbar>.ds-grow{flex:1}
.ds-datebar{margin:calc(var(--space-1) * -1) 0 calc(var(--space-2) * -1)}
.ds-dbsearch{flex:0 0 16.25rem}
.ds-grow{flex:1;min-width:0}
.ds-meta{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-meta-strong{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-muted)}
.ds-title-xl{font-size:var(--text-xl);line-height:var(--line-height-xl);font-weight:var(--weight-semibold);letter-spacing:var(--letter-spacing-tight)}
.ds-link-btn{display:inline-flex;align-items:center;gap:var(--space-1);padding:0;border:0;background:transparent;color:var(--link);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-link-btn:hover{color:var(--link-hover);text-decoration:underline}
.ds-link-btn svg{width:.875rem;height:.875rem}
.ds-mute-btn{display:inline-flex;align-items:center;gap:var(--space-1);padding:0;border:0;background:transparent;color:var(--fg-muted);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium)}
.ds-mute-btn svg{width:.875rem;height:.875rem}
.ds-mute-btn:hover{color:var(--fg)}
.ds-back{align-self:flex-start;height:var(--control-sm);display:inline-flex;align-items:center;gap:var(--space-1);margin:0 0 calc(var(--space-2) * -1) calc(var(--space-1) * -1);padding:0 var(--space-2) 0 var(--space-1);border:0;border-radius:var(--radius-md);background:transparent;color:var(--fg-muted);font-weight:var(--weight-medium);text-decoration:none}
.ds-back:hover{background:var(--bg-muted);color:var(--fg);text-decoration:none}
.ds-back svg{width:1rem;height:1rem}

/* ───────── Cards and rows ───────── */
.ds-card{border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);background:var(--bg);display:flex;flex-direction:column;gap:var(--space-0-5);padding:var(--space-4) var(--space-3) var(--space-3);min-width:0}
.ds-card[data-pad="all"]{padding:var(--space-4);gap:var(--space-3)}
.ds-card[data-pad="lg"]{padding:var(--space-5);gap:var(--space-4)}
.ds-card[data-pad="none"]{padding:0;gap:0;overflow:hidden}
.ds-card__head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);padding:0 var(--space-2) var(--space-3)}
.ds-card[data-pad="all"] .ds-card__head,.ds-card[data-pad="lg"] .ds-card__head{padding:0}
/* The title never drops below 14rem: when the head runs out of room its actions wrap under it. */
.ds-card__title{display:flex;flex-direction:column;flex:1 1 14rem;min-width:0}
.ds-card__title h2,.ds-card__title h3{font-size:var(--text-md);line-height:var(--line-height-sm);font-weight:var(--weight-semibold);color:var(--fg)}
.ds-subhead{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2) var(--space-1)}
.ds-subhead h3{flex:1}
.ds-row{display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-3-5) var(--space-2);border:0;border-radius:var(--radius-md);background:transparent;color:var(--fg);text-align:left;text-decoration:none;min-width:0}
a.ds-row:hover,button.ds-row:hover,.ds-row[data-hover]:hover{background:var(--bg-subtle);color:var(--fg);text-decoration:none}
.ds-row[data-dense]{padding:var(--space-2-5) var(--space-2)}
.ds-row__body{display:flex;flex-direction:column;gap:var(--space-0-5);flex:1;min-width:0}
.ds-row__title{font-weight:var(--weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-row__sub{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-row__end{flex:none;color:var(--fg-disabled);display:flex}
.ds-row__end svg{width:1rem;height:1rem}
.ds-tile-icon{width:var(--control-sm);height:var(--control-sm);flex:none;display:grid;place-items:center;border:var(--border-width) solid var(--border);border-radius:var(--radius-md);color:var(--brand-primary-text)}
.ds-tile-icon svg{width:1rem;height:1rem}
.ds-tile-icon[data-tone="tint"]{width:1.5rem;height:1.5rem;border:0;border-radius:var(--radius-sm);background:var(--brand-primary-subtle)}
.ds-tile-icon[data-tone="tint"] svg{width:.875rem;height:.875rem}
.ds-check{width:1.125rem;height:1.125rem;flex:none;display:grid;place-items:center;border-radius:var(--radius-full);border:1.5px solid var(--border-strong);background:var(--bg);color:var(--accent-fg);padding:0}
.ds-check svg{width:.75rem;height:.75rem}
.ds-check[data-on]{background:var(--accent);border-color:var(--accent)}
button.ds-check:hover{border-color:var(--accent)}
button.ds-check{position:relative}button.ds-check::after{content:"";position:absolute;inset:calc(var(--space-1) * -1)}
.ds-box{width:1.125rem;height:1.125rem;flex:none;display:grid;place-items:center;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--bg);color:var(--accent-fg);padding:0}
.ds-box svg{width:.75rem;height:.75rem}
.ds-box[data-on]{background:var(--accent);border-color:var(--accent)}
.ds-empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-8) var(--space-4);text-align:center}
.ds-empty__icon{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:var(--radius-full);background:var(--bg-muted);color:var(--fg-muted)}
.ds-empty__icon[data-tone="danger"]{background:var(--danger-bg);color:var(--danger)}
.ds-empty__icon svg{width:1.125rem;height:1.125rem}
.ds-empty b{font-weight:var(--weight-medium)}
.ds-note{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2-5) var(--space-2);border-radius:var(--radius-md);background:var(--bg-subtle);color:var(--fg-muted)}
.ds-note svg{width:1rem;height:1rem;flex:none}
.ds-note--info{padding:var(--space-3) var(--space-3-5);border-radius:var(--radius-lg);background:var(--brand-primary-subtle);color:var(--brand-primary-text)}
.ds-dashed{padding:var(--space-6);text-align:center;border:var(--border-width) dashed var(--border-strong);border-radius:var(--radius-xl);color:var(--fg-muted)}

/* ───────── Badges: class and trust ───────── */
.ds-class{height:1.375rem;min-width:1.375rem;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0 var(--space-1);border:var(--border-width) solid transparent;border-radius:var(--radius-sm);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-semibold);white-space:nowrap}
.ds-class[data-label]{padding:0 var(--space-2);font-weight:var(--weight-medium)}
.ds-class[data-cls="A"]{background:var(--brand-primary);color:var(--brand-primary-on)}
.ds-class[data-cls="B"]{background:var(--brand-secondary);color:var(--brand-secondary-on)}
.ds-class[data-cls="C"]{background:var(--bg);border-color:var(--border-strong);color:var(--fg-secondary)}
.ds-class[data-cls="D"]{background:var(--bg-muted);color:var(--fg-subtle)}
.ds-class[data-cls="LH"]{min-width:1.75rem;background:var(--bg);border:var(--border-width) dashed var(--border-strong);color:var(--fg-subtle)}
.ds-trust[data-trust="stale"]{background:var(--bg-muted);border-color:var(--border);color:var(--fg-muted)}
.ds-chip{height:1.5rem;flex:none;display:inline-flex;align-items:center;gap:var(--space-1-5);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--bg-muted);color:var(--fg-muted);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-chip[data-tone="strong"]{color:var(--fg)}
.ds-chip[data-tone="outline"]{background:var(--bg);border:var(--border-width) solid var(--border);color:var(--fg-secondary)}
.ds-chip[data-tone="danger"]{background:var(--danger-bg);color:var(--danger)}
.ds-chip[data-tone="success"]{background:var(--success-bg);color:var(--success)}
.ds-chip[data-tone="info"]{background:var(--brand-primary-subtle);color:var(--brand-primary-text)}
.ds-chip svg{width:.875rem;height:.875rem}
button.ds-chip{border:var(--border-width) solid var(--border);background:var(--bg)}
button.ds-chip:hover{background:var(--bg-subtle)}
.ds-chip__bar{width:2.25rem;height:4px;border-radius:var(--radius-full);background:var(--border);overflow:hidden;display:flex}
.ds-chip__bar>span{height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-dot{width:6px;height:6px;flex:none;border-radius:var(--radius-full);background:var(--fg-disabled)}
.ds-dot[data-tone="active"]{background:var(--chart-primary)}.ds-dot[data-tone="good"]{background:var(--success)}.ds-dot[data-tone="bad"]{background:var(--danger)}
.ds-filter-chip{height:1.5rem;display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-full);background:var(--brand-primary-subtle);color:var(--brand-primary-text);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium)}
.ds-filter-chip svg{width:.75rem;height:.75rem}
.ds-pill-btn{height:1.75rem;display:inline-flex;align-items:center;padding:0 var(--space-2-5);border-radius:var(--radius-full);border:var(--border-width) solid var(--border);background:var(--bg);color:var(--fg-secondary);font-size:var(--text-xs);line-height:var(--line-height-xs);font-weight:var(--weight-medium);white-space:nowrap}
.ds-pill-btn:hover{background:var(--bg-subtle)}
.ds-pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* ───────── Progress and charts ───────── */
.ds-progress{width:7.5rem;height:6px;flex:none;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.ds-progress>span{display:block;height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-progress[data-tone="accent"]>span{background:var(--chart-primary)}
.ds-progress[data-size="thin"]{height:4px}
.ds-progress[data-fill]{width:auto}
.ds-bars{height:10.25rem;display:flex;align-items:flex-end;gap:var(--space-4);position:relative}
.ds-bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--space-1-5);min-width:0}
.ds-bar__v{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-bar__fill{width:100%;max-width:3rem;border-radius:var(--radius-xs);background:var(--chart-primary)}
.ds-bar__fill[data-today]{background:var(--chart-today)}
.ds-bar__fill[data-zero]{background:var(--chart-empty)}
.ds-bar__fill[data-muted]{background:var(--chart-muted)}
.ds-bar__d{font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle);white-space:nowrap}
.ds-bar__v[data-zero]{color:var(--fg-disabled)}
.ds-goal{position:absolute;left:0;right:0;height:0;border-top:var(--border-width) dashed var(--chart-goal)}
.ds-goal>span{position:absolute;right:0;bottom:2px;padding-left:var(--space-1);background:var(--bg);font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}
.ds-hbars{display:flex;flex-direction:column;gap:var(--space-2-5)}
.ds-hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.5rem;gap:var(--space-3);align-items:center}
.ds-hbar__track{height:8px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.ds-hbar__track>span{display:block;height:100%;border-radius:var(--radius-full);background:var(--chart-today)}
.ds-hbar__track>span[data-tone="accent"]{background:var(--chart-primary)}.ds-hbar__track>span[data-tone="muted"]{background:var(--chart-muted)}
.ds-hbar__n{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-muted)}
.ds-linechart{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2) var(--space-2) 0}
.ds-linechart__plot{position:relative;height:10rem}
.ds-linechart__plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ds-line__grid{stroke:var(--border-subtle);stroke-width:1;vector-effect:non-scaling-stroke}
.ds-line__path{fill:none;stroke:var(--chart-primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ds-line__area{fill:var(--brand-primary-subtle);stroke:none}
.ds-linechart__dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:var(--radius-full);background:var(--bg);box-shadow:0 0 0 2px var(--chart-primary)}
.ds-linechart__dot[data-last]{width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px var(--chart-today)}
.ds-linechart__x{display:flex;justify-content:space-between;margin:0 calc(var(--space-4) * -1)}
.ds-linechart__x span{width:4rem;text-align:center;font-size:var(--text-xs);line-height:var(--line-height-xs);color:var(--fg-subtle)}

/* ───────── Home ───────── */
.ds-plan__steps{display:flex;flex-direction:column;gap:var(--space-0-5)}
.ds-plan__actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-2-5) var(--space-2) var(--space-2);margin-top:var(--space-1-5)}
.ds-pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10rem,100%),1fr));gap:1px;border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--border)}

@media(max-width:1279px){.ds-rhead{grid-template-columns:auto minmax(0,1fr)}.ds-rhead__actions{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;margin-top:var(--space-2)}}
.ds-livebar{position:sticky;top:0;z-index:var(--layer-sticky);height:3rem;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-3) 0 var(--space-8);background:var(--shell);color:var(--shell-fg-strong);border-radius:calc(var(--radius-xl) - 1px) calc(var(--radius-xl) - 1px) 0 0}

.ds-kv{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(18.75rem,100%),1fr));column-gap:var(--space-8)}
.ds-kv[data-cols="1"]{grid-template-columns:minmax(0,1fr)}
.ds-kv__row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-3) 0;border-bottom:var(--border-width) solid var(--border-subtle)}

.ds-sev{height:1.25rem;display:inline-flex;align-items:center;padding:0 var(--space-1-5);border-radius:var(--radius-sm);background:var(--bg-muted);color:var(--fg-muted);font-size:var(--text-2xs);line-height:var(--line-height-2xs);font-weight:var(--weight-semibold);white-space:nowrap}
.ds-sev[data-sev="Critical"]{background:var(--danger-bg);color:var(--danger)}.ds-sev[data-sev="Strong"]{background:var(--warning-bg);color:var(--warning)}
.ds-best{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.ds-best__icon{width:2.5rem;height:2.5rem;flex:none;display:grid;place-items:center;border-radius:var(--radius-full);background:var(--brand-primary-subtle);color:var(--brand-primary-text)}

.ds-life[data-tone="good"]{color:var(--success)}.ds-life[data-tone="ok"]{color:var(--brand-secondary-text)}.ds-life[data-tone="warn"]{color:var(--warning)}.ds-life[data-tone="bad"]{color:var(--danger)}.ds-life[data-tone="muted"]{color:var(--fg-subtle)}
.ds-cp{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2-5) 0;border-bottom:var(--border-width) solid var(--border-subtle)}

.ds-calcol{position:relative;height:36rem;cursor:copy;border-left:var(--border-width) solid var(--border-subtle);background-color:var(--bg);background-image:repeating-linear-gradient(to bottom,var(--border-subtle) 0 1px,transparent 1px 48px)}
.ds-calcol[data-weekend]{background-color:var(--bg-subtle)}

.ds-ev{position:absolute;box-sizing:border-box;border-radius:var(--radius-sm);padding:3px var(--space-1-5);border:var(--border-width) solid var(--bg);font-size:var(--text-xs);line-height:var(--line-height-xs);display:flex;flex-direction:column;gap:1px;overflow:hidden;text-align:left;cursor:pointer;z-index:1;background:var(--ev-bg);color:var(--ev-fg)}

/* ───────── Display tabs (Outreach performance, Reporting, Listings, Web analytics) ───────── */
.ds-statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10.5rem,100%),1fr));gap:1px;border:var(--border-width) solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--border)}

<script>/* Portal-safe navigation and screen-state presets. Product-safe: no review UI.
   Load it on every product page, after theme.js and before js/product.js (both deferred).
   Why: the Design Portal serves every screen state as its own renamed file. Screens survive
   that when (1) every move between screens is a real link in the markup, (2) a state can be
   switched on by a preset, and (3) timed moves only fire inside a real click-through.
   tools/export_portal.py relies on this contract. See DESIGN.md, "Portal export". */
(() => {
  const params = new URLSearchParams(location.search);
  // Exported portal files bake their state preset in; URL parameters still win.
  for (const [key, value] of Object.entries(window.PREVIEW_PARAMS || {})) if (!params.has(key)) params.set(key, value);
  const exported = window.PREVIEW_EXPORT === true;
  // ?preview=still (the canvas and exported snapshots): no timed moves, entrances settled.
  const still = params.get('preview') === 'still';
  const carried = ['theme'];

  const carry = href => {
    const url = new URL(href, location.href);
    if (url.origin === location.origin) for (const key of carried) if (params.get(key) && !url.searchParams.has(key)) url.searchParams.set(key, params.get(key));
    return url.href;
  };

  /* route('details') → the href of <a data-route="details"> (or a link to details.html) on this page.
     Script-driven moves must use it: hosts that rename screens rewrite those links, never script strings.
     For moves a script makes, add a hidden nav (hidden, data-routes, aria-hidden="true") holding one
     anchor per destination, with data-route set to the page name, an href to that page, and the trigger
     label as its text. See DESIGN.md, "Portal export", for the markup. */
  const route = (name, query = '') => {
    const link = document.querySelector(`a[data-route="${name}"]`) || document.querySelector(`a[href^="${name}.html"]`);
    const url = new URL(link ? link.getAttribute('href') : `${name}.html`, location.href);
    url.search = '';
    new URLSearchParams(query).forEach((value, key) => url.searchParams.set(key, value));
    return carry(url.href);
  };
  const go = (name, query) => location.assign(route(name, query));
  const replace = (name, query) => location.replace(route(name, query));

  // In an exported file, a timed move fires only when the visitor arrived from a sibling screen,
  // so a portal canvas frame of "Loading…" stays on its own state.
  const fromSibling = () => {
    try {
      const from = new URL(document.referrer);
      const folder = path => path.replace(/[^/]*$/, '');
      return from.origin === location.origin && folder(from.pathname) === folder(location.pathname);
    } catch (_) { return false; }
  };
  const advance = (fn, ms) => { if (!still && (!exported || fromSibling())) return setTimeout(fn, ms); };

  // Nav.asset('../assets/brand/logo.png') → the inlined copy in exported files, else the path itself.
  const asset = path => {
    const key = new URL(path, location.href).pathname.replace(/^.*?(?=assets\/)/, '');
    return (window.PREVIEW_ASSETS || {})[key] || path;
  };

  // Keep an explicit theme choice on in-product links.
  document.addEventListener('click', event => {
    const link = event.target.closest && event.target.closest('a[href]');
    if (link && link.origin === location.origin && carried.some(key => params.get(key))) link.href = carry(link.getAttribute('href'));
  });

  // Still previews render settled: finite entrances finish, ambient loops keep running.
  if (still) addEventListener('load', () => {
    for (const animation of document.getAnimations ? document.getAnimations() : []) {
      if (animation.effect && animation.effect.getTiming().iterations !== Infinity) animation.finish();
    }
  });

  window.Nav = { params, still, exported, route, go, replace, advance, asset };
})();
</script>

<script>/* Death Star product runtime: demo store, the navy shell, Brain, ⌘K, the peek drawer and shared UI.
   Screens register with DS.define() from js/screens/<page>.js. Every move between screens is a real
   link resolved through Nav.route(), so the portal export can rename screens. */
(() => {
  const D = window.DS_DATA;
  const Nav = window.Nav || { params: new URLSearchParams(location.search), route: n => n + '.html', go: n => location.assign(n + '.html'), advance: (f, ms) => setTimeout(f, ms), still: false };
  const params = Nav.params;
  const OFF = 'Not in this proposal yet';

  /* ───────── Utilities ───────── */
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const icon = (name, weight = 'regular') => `<svg class="icon ph-icon" aria-hidden="true" focusable="false" viewBox="0 0 256 256">${(window.PHOSPHOR || {})[name + '-' + weight] || ''}</svg>`;
  const attrs = o => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== false).map(([k, v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join('');
  const href = (page, query = '') => Nav.route(page, query);
  const loc = n => Number(n).toLocaleString('en-US');
  const pct = n => n + '%';
  const fmtL = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const fmtS = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtMD = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const tFmt = x => { const hh = Math.floor(x), mm = Math.round((x - hh) * 60); return ((hh + 11) % 12 + 1) + (mm ? ':' + String(mm).padStart(2, '0') : '') + (hh < 12 ? ' AM' : ' PM'); };
  const initials = n => n.split(' ').map(x => x[0]).join('').slice(0, 2);
  const isEmptyVal = v => /^(Not on record|None on record|Never called|None yet|Not set)$/.test(String(v));

  /* ───────── Store: demo data in local storage, session UI in session storage ───────── */
  const STORE = 'ds-proto-v2', UI = 'ds-ui-v2';
  const fresh = () => ({ done: {}, calls: 0, convos: 0, tl: {}, last: {}, bad: {}, flags: {}, tasks: D.tasks.map(t => ({ ...t })), goalDone: {}, calNew: [], convs: [], clists: {}, ctog: {}, ranked: {}, recent: ['marchetti', 'p118', 'feld'], lists: [], storefront: {}, pnotes: {} });
  const read = (storage, key) => { try { return JSON.parse(storage.getItem(key) || 'null'); } catch (_) { return null; } };
  const write = (storage, key, value) => { try { storage.setItem(key, JSON.stringify(value)); } catch (_) {} };
  // Presets that change demo data render a snapshot; they never overwrite the saved demo.
  const isSnapshot = () => ['called', 'call', 'flag', 'added', 'approved', 'ask', 'chat', 'reset'].some(k => params.has(k)) && params.get('reset') !== '1';
  let snapshot = isSnapshot();
  let S = { ...fresh(), ...(read(localStorage, STORE) || {}) };
  if (params.get('reset') === '1') { S = fresh(); write(localStorage, STORE, S); try { sessionStorage.removeItem(UI); } catch (_) {} }
  const loadU = () => ({ navRail: null, moreOpen: false, navGrp: {}, brainUser: null, msgs: null, chatTitle: null, chatId: null, seen: false, scopeOff: false, call: null, outcome: null, ...(read(sessionStorage, UI) || {}) });
  let U = loadU();
  const save = () => { if (snapshot) return; write(localStorage, STORE, S); write(sessionStorage, UI, U); };
  // Per-screen view state; Brain's draft, thinking and streaming carry across screens.
  const freshV = () => ({ menu: null, drawer: false, brainHere: false, pal: null, peek: null, peekDir: 0, acc: null, guideTab: 'flows', brainParam: params.get('brain') });
  const V = { toast: null, draft: '', thinking: false, thinkSteps: [], thinkI: 0, stream: null, ...freshV() };

  /* ───────── Shared UI helpers ───────── */
  const ui = {};
  ui.icon = icon;
  ui.cls = (k, label) => `<span class="ds-class"${label ? ' data-label' : ''} data-cls="${k}">${label ? esc((k === 'LH' ? 'LH' : 'Class ' + k) + ' · ' + D.CLASS[k]) : esc(k)}</span>`;
  ui.trust = (k, word) => { const t = D.TRUST[k]; return `<span class="badge ds-trust"${t.status ? ` data-status="${t.status}"` : ''} data-trust="${k}">${icon(t.icon)}${esc(word || t.word)}</span>`; };
  ui.btn = ({ label = '', ic, variant, size, act, arg, link, shape, aria, tip, side, id, cls = '', disabled, busy, pressed, expanded, extra = {} }) => {
    const a = { class: 'button' + (label ? '' : ' button--icon') + (cls ? ' ' + cls : ''), 'data-variant': variant, 'data-size': size, 'data-shape': shape, 'aria-label': aria, 'data-tip': tip || (disabled ? OFF : null), 'data-tip-side': side, id, 'aria-busy': busy ? 'true' : null, 'aria-pressed': pressed, 'aria-expanded': expanded, ...extra };

  ui.stateTabs = (items, current, act, label) => `<div class="tabs"><div class="tabs__list" role="tablist" aria-label="${esc(label)}">${items.map(([k, l, off]) => off

  ui.nudge = text => `<p class="ds-nudge">${icon('sparkle')}<span>${esc(text)}</span><button type="button" class="ds-link-btn" data-act="ask-nudge" data-arg="${esc(text)}">Ask Brain</button></p>`;
  ui.kv = (rows, opts = {}) => `<dl class="ds-kv"${opts.cols ? ` data-cols="${opts.cols}"` : ''}${opts.compact ? ' data-compact' : ''}>${rows.map(([k, v, x = {}]) => `<div class="ds-kv__row"><dt>${esc(k)}</dt><dd${isEmptyVal(v) ? ' data-empty' : ''}${x.hot ? ' data-hot' : ''}>${x.html ? v : esc(v)}</dd>${x.end || ''}</div>`).join('')}</dl>`;

    const pk = params.get('peek'); if (pk && !V.peek) { const k = cById[pk] ? 'c' : pById[pk] ? 'p' : null; if (k) V.peek = { k, id: pk, tab: params.get('peektab') || 'overview', mode: params.get('peekmode') || 'side' }; }
    if (params.get('ask') && sc.id !== 'brain') DS.seedChat(params.get('ask'), params.get('stage'));
    const pal = params.get('palette'); if (pal) V.pal = { mode: pal, q: params.get('pq') || '', active: 0 };
    if (params.get('guide')) { V.menu = 'guide'; V.guideTab = params.get('guide') === 'structure' ? 'structure' : 'flows'; }
    if (params.get('menu')) V.menu = params.get('menu');
    railWas = layoutKey();
    render();
    try { const t = sessionStorage.getItem('ds-toast'); if (t) { sessionStorage.removeItem('ds-toast'); DS.toast(t); } } catch (_) {}
    if (V.pal) setTimeout(() => { const el = document.getElementById('palette-input'); if (el) el.focus(); }, 20);
    here = location.pathname + location.search;
  };
  DS.boot = () => {
    if (!DS.screen) return;
    startScreen();
    // Live-call timer: update the clock without re-rendering the page.
    setInterval(() => { if (!U.call) return; const s = Math.floor((Date.now() - U.call.t0) / 1000), txt = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); document.querySelectorAll('[data-calltime]').forEach(el => { el.textContent = txt; }); }, 1000);
  };

  /* ───────── Screen switching ─────────
     Every move is still a real link (the portal export and new tabs rely on that). Same-folder pages
     swap in place instead of reloading: fetch the page, run its screen script, re-render, and push the
     URL. The shell, Brain and timers stay mounted, so moving around feels like one app. Exported portal
     files, file:// and failures fall back to a normal page load. */
  let here = location.pathname + location.search, navSeq = 0;
  const pages = new Map(), codes = new Map();
  const canSwap = !Nav.exported && /^https?:$/.test(location.protocol) && !!window.DOMParser && !!(history && history.pushState);
  const folder = p => p.replace(/[^/]*$/, '');
  const isScreen = url => url.origin === location.origin && folder(url.pathname) === folder(location.pathname) && /\.html$/.test(url.pathname);
  const text = u => fetch(u, { credentials: 'same-origin' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  const loadScreen = url => {
    const key = url.pathname;
    if (!pages.has(key)) {
      const job = text(url.pathname).then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const src = [...doc.querySelectorAll('script[src]')].map(x => new URL(x.getAttribute('src'), url).href).find(x => /\/js\/screens\//.test(x));
        if (!src) throw new Error('No screen script');
        if (!codes.has(src)) codes.set(src, text(src));
        return codes.get(src).then(code => ({ title: doc.title, page: doc.body.dataset.page, routes: (doc.querySelector('nav[data-routes]') || {}).innerHTML, code, src }));
      });
      job.catch(() => { pages.delete(key); });
      pages.set(key, job);
    }
    return pages.get(key);
  };
  const swapTo = (pg, url) => {
    [...new Set(params.keys())].forEach(k => params.delete(k));
    url.searchParams.forEach((v, k) => params.append(k, v));
    snapshot = isSnapshot();
    S = { ...fresh(), ...(read(localStorage, STORE) || {}) };
    U = loadU();
    Object.assign(V, freshV());
    document.title = pg.title;
    if (pg.page) document.body.dataset.page = pg.page; else delete document.body.dataset.page;
    const routes = document.querySelector('nav[data-routes]'); if (routes && pg.routes != null) routes.innerHTML = pg.routes;
    hideTip();
    const had = document.activeElement && document.activeElement !== document.body;
    DS.screen = null;
    const run = document.createElement('script'); run.textContent = pg.code + '\n//# sourceURL=' + pg.src; document.head.appendChild(run); run.remove();
    if (!DS.screen) { location.reload(); return; }
    const main = document.getElementById('ds-main');
    DS.vt(() => { firstPaint = true; animSeen = new Set(); startScreen(); main.scrollTop = 0; });
    if (had && (!document.activeElement || document.activeElement === document.body)) main.focus({ preventScroll: true });
    const say = document.getElementById('ds-announce'); if (say) say.textContent = pg.title.replace(/ — .*$/, '');
    dispatchEvent(new CustomEvent('screenchange', { detail: { href: location.href } }));
  };
  DS.navigate = (to, { replace = false, pop = false } = {}) => {
    const url = new URL(to, location.href);
    const hard = () => (replace || pop) ? location.replace(url.href) : location.assign(url.href);
    if (!canSwap || !isScreen(url)) { hard(); return; }
    const seq = ++navSeq;
    loadScreen(url).then(pg => {
      if (seq !== navSeq) return;
      DS.referrer = location.href;
      if (!pop) history[replace ? 'replaceState' : 'pushState']({ ds: 1 }, '', url.href);
      swapTo(pg, url);
    }).catch(() => { if (seq === navSeq) hard(); });
  };
  Nav.go = (name, query) => DS.navigate(Nav.route(name, query));
  Nav.replace = (name, query) => DS.navigate(Nav.route(name, query), { replace: true });
  const swappable = ev => {
    const a = ev.target.closest && ev.target.closest('a[href]');
    if (!canSwap || !a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return null;
    const url = new URL(a.href, location.href); return isScreen(url) ? url : null;
  };
  document.addEventListener('click', ev => {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    const url = swappable(ev); if (!url) return;
    if (url.pathname + url.search === location.pathname + location.search) { if (!url.hash) ev.preventDefault(); return; }
    ev.preventDefault(); DS.navigate(url.href);
  });
  // Warm the next screen while the pointer is on its link.
  const warm = ev => { const url = swappable(ev); if (url) loadScreen(url).catch(() => {}); };
  document.addEventListener('pointerover', warm); document.addEventListener('focusin', warm);
  addEventListener('popstate', () => { if (location.pathname + location.search !== here) DS.navigate(location.href, { pop: true }); });
  DS.setUI = patch => { Object.assign(U, patch); save(); };
  DS.setStore = patch => { Object.assign(S, patch); save(); };
  // Deferred screen scripts run after this file but before DOMContentLoaded, so boot there.
  // A screen registered after the document is ready boots itself from DS.define().
  // A page transition interrupted by another click is simply dropped; keep that out of the console.
  const quiet = e => { const t = e.viewTransition; if (t) [t.ready, t.finished, t.updateCallbackDone].forEach(x => x && x.catch(() => {})); };
  addEventListener('pageswap', quiet); addEventListener('pagereveal', quiet);
  let booted = false, domReady = false;
  const bootOnce = () => { if (booted || !DS.screen) return; booted = true; DS.boot(); };
  document.addEventListener('DOMContentLoaded', () => { domReady = true; bootOnce(); });
  if (document.readyState === 'complete') domReady = true;
  DS.define = screen => { DS.screen = screen; if (domReady) setTimeout(bootOnce, 0); };
})();
</script>
<script>/* 04 Brain: history, the empty state with suggestions, and a centred conversation with rich answers. */
(() => {
  const { D, ui, esc, icon, href, params } = DS;
  const st = { histQ: '', docsOpen: false };
  const U = DS.U();
  // Presets: ask=why|list|lookup|first, stage=thinking|streaming, approved=1, chat=<history id>, new=1.
  if (params.get('new') === '1') { U.msgs = []; U.chatTitle = null; U.chatId = null; }
  const chatId = params.get('chat');
  if (chatId) { const ch = D.chats.find(x => x.id === chatId); if (ch) { U.chatId = ch.id; U.chatTitle = ch.t; U.msgs = ch.m ? ch.m.map(m => ({ ...m })) : [{ ...D.proactive }]; } }

  const history = () => {
    const q = st.histQ.toLowerCase().trim(), groups = ['Pinned', 'Today', 'Previous 7 days', 'Older'].map(g => ({ g, items: D.chats.filter(c => c.g === g && (!q || c.t.toLowerCase().includes(q))) })).filter(g => g.items.length);
    return `<aside class="ds-history" aria-label="Chat history"><div class="ds-history__top">${ui.btn({ label: 'New chat', ic: 'note-pencil', variant: 'outline', act: 'new-chat', cls: 'ds-newchat' })}<label class="ds-input-icon">${icon('magnifying-glass')}<input id="hist-q" aria-label="Search chats" placeholder="Search chats" value="${esc(st.histQ)}" data-input="histQ" autocomplete="off"></label></div>
      <div class="ds-history__list">${groups.map(({ g, items }) => `<div class="ds-history__group"><span>${esc(g)}</span>${items.map(c => `<button type="button" class="ds-hitem"${U.chatId === c.id ? ' aria-current="true"' : ''} data-act="open-chat" data-arg="${c.id}">${c.pin ? icon('push-pin') : ''}<span>${esc(c.t)}</span></button>`).join('')}</div>`).join('')}${groups.length ? '' : `<span class="ds-meta" style="padding:var(--space-2)">No chats match “${esc(st.histQ)}”.</span>`}
        <div class="ds-history__group">${[['Folders', 'folders'], ['Archived', 'archive']].map(([l, ic]) => `<span class="ds-hitem" role="button" tabindex="0" aria-disabled="true" data-tip="${DS.OFF}" data-tip-side="right">${icon(ic)}<span>${l}</span></span>`).join('')}</div></div>
      <div style="padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-0-5)"><button type="button" class="ds-hitem font-medium" aria-expanded="${st.docsOpen}" data-act="docs">${icon('folder')}<span>Stored documents</span><span class="ds-meta" style="flex:none">3</span>${icon(st.docsOpen ? 'caret-down' : 'caret-right')}</button>
        ${st.docsOpen ? D.docs.map(([n, s]) => `<div class="ds-doc" data-anim="expand" data-key="doc-${esc(n)}">${icon('file-text')}<span class="ds-row__body"><span class="ds-row__title" style="font-size:var(--text-xs);line-height:var(--line-height-xs)">${esc(n)}</span><span class="ds-row__sub">${esc(s)}</span></span></div>`).join('') : ''}</div></aside>`;
  };
  const chips = [['Why now for…', 'Daniel Marchetti, or any owner', 'sparkle', 'Why now for Daniel Marchetti?'], ['Build a list of…', 'LES owners with debt due this year', 'list-bullets', '/list LES owners with debt due before year end'], ['Look up a property…', '118 Ludlow St, or a BBL', 'buildings', 'Look up 118 Ludlow St'], ['This week’s market brief', 'Sales, listings and rates', 'newspaper', null]];
  const empty = () => `<div class="ds-brain-empty"><div class="ds-brain-empty__inner"><div class="ds-brain-hello"><span class="ds-brain-hello__icon">${icon('sparkle')}</span><h1>What do you need, Thomas?</h1><span class="ds-lede">Ask about an owner, a building or a list. Answers cite their sources.</span></div>
    ${DS.composer(true, { rows: 2, ph: 'Ask about a contact, property or list' })}
    <div class="ds-chips">${chips.map(([t, s, ic, q]) => q ? `<button type="button" class="ds-chipcard" data-act="ask" data-arg="${esc(q)}">${icon(ic)}<span class="ds-row__body"><span class="font-medium">${esc(t)}</span><span class="ds-meta">${esc(s)}</span></span></button>` : `<div class="ds-chipcard" role="button" tabindex="0" aria-disabled="true" data-tip="${DS.OFF}">${icon(ic)}<span class="ds-row__body"><span class="font-medium">${esc(t)}</span><span class="ds-meta">${esc(s)}</span></span></div>`).join('')}</div></div></div>`;
  const convo = () => `<h1 class="sr-only">Brain · ${esc(U.chatTitle || 'New chat')}</h1><div class="ds-chat" data-page aria-live="polite" id="page-chat" data-keep-scroll="page-chat"><div class="ds-chat__inner" id="page-chat-inner">${DS.chatHTML(true)}</div></div>
    <div class="ds-brainpage__foot"><div style="max-width:47.5rem;margin:0 auto">${DS.composer(true)}</div><p class="ds-meta ds-disclaimer">Brain can be wrong. Check trust badges before you say it out loud.</p></div>`;

  DS.define({
    id: 'brain', nav: 'brain',
    crumbs: () => [{ l: 'Brain', page: 'brain' }, { l: 'Chat' }],
    scope: () => 'Brain',
    init: () => { const k = params.get('ask'); if (k) DS.seedChat(k, params.get('stage')); },
    render: () => {
      const has = (U.msgs || []).length > 0 || DS.V.thinking;
      return `<div class="ds-brainpage">${history()}<div class="ds-brainpage__main"><div class="ds-brainpage__tabs">${ui.stateTabs([['chat', 'Chat'], ['learning', 'Learning Mode', true]], 'chat', 'noop', 'Brain')}<span class="ds-grow"></span>${has ? `<span class="ds-meta ds-ellipsis" style="max-width:20rem">${esc(U.chatTitle || 'New chat')}</span>` : ''}</div>${has ? convo() : empty()}</div></div>`;
    },
    after: () => { if (DS.V.focusPage) { DS.V.focusPage = false; const el = document.getElementById('brain-page-input'); if (el) el.focus(); } },
    acts: {
      noop: () => {},
      'open-chat': (el, cid) => { const ch = D.chats.find(x => x.id === cid); U.chatId = cid; U.chatTitle = ch.t; U.msgs = ch.m ? ch.m.map(m => ({ ...m })) : [{ ...D.proactive }]; DS.V.thinking = false; DS.V.stream = null; DS.save(); DS.V.scrollChat = true; DS.render(); },
      'new-chat': () => { U.msgs = []; U.chatId = null; U.chatTitle = null; DS.V.draft = ''; DS.save(); DS.V.focusPage = true; DS.render(); },
      docs: () => { st.docsOpen = !st.docsOpen; DS.render(); },
    },
    inputs: { histQ: v => { st.histQ = v; DS.render(); } },
  });
})();
</script>
